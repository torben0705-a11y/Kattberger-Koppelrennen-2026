<body class="bg-zinc-950 text-zinc-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel" data-type="module" data-presets="react">
    import React, { useState, useEffect, useRef, useMemo } from 'react';
    import ReactDOM from 'react-dom/client';
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { getFirestore, doc, setDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';
    import { 
      Trophy, Clock, Play, Pause, RotateCcw, Plus, Trash2, Users, MapPin, Calendar, 
      Award, ChevronRight, Flag, Zap, CheckCircle, AlertTriangle, User, ShieldAlert, 
      Sliders, RefreshCw, Share2, Check, Lock, Unlock, Edit3, Save, X, Shield, Key, 
      BookOpen, ArrowUpDown, QrCode, Car, Flame, Radio
    } from 'lucide-react';

    let app, auth, db, appId;
    const hasFirebase = typeof window !== 'undefined' && typeof window.__firebase_config !== 'undefined';

    if (hasFirebase) {
      try {
        const firebaseConfig = JSON.parse(window.__firebase_config);
        app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);
        appId = typeof window.__app_id !== 'undefined' ? window.__app_id : 'default-app-id';
      } catch (e) {
        console.error("Firebase Initialisierungsfehler:", e);
      }
    }

    const initialTeams = [
      { id: '1', number: '1', name: 'Team Ackerschreck', p1: 'Lars', p2: 'Micha', car: 'BMW', pin: '1111', ringHits: [false, false, false, false, false], t1: 0, t2: 0, race1Laps: 0, race2Laps: 0, race3Laps: 0, penalties: 0, penaltyReason: '', customPoints: 0, assignedRefId: 'ref1' },
      { id: '2', number: '2', name: 'Rostlaube Racing', p1: 'Niklas', p2: 'Henning', car: '', pin: '2222', ringHits: [false, false, false, false, false], t1: 0, t2: 0, race1Laps: 0, race2Laps: 0, race3Laps: 0, penalties: 0, penaltyReason: '', customPoints: 0, assignedRefId: 'ref1' },
      { id: '3', number: '3', name: 'Turbo Schnäggn', p1: 'Knolle', p2: 'Laura', car: 'Bora', pin: '3333', ringHits: [false, false, false, false, false], t1: 0, t2: 0, race1Laps: 0, race2Laps: 0, race3Laps: 0, penalties: 0, penaltyReason: '', customPoints: 0, assignedRefId: 'ref2' },
      { id: '4', number: '4', name: 'Biernot Motorsport', p1: 'Steven', p2: 'Dennis', car: 'Opel Corsa B', pin: '4444', ringHits: [false, false, false, false, false], t1: 0, t2: 0, race1Laps: 0, race2Laps: 0, race3Laps: 0, penalties: 0, penaltyReason: '', customPoints: 0, assignedRefId: 'ref2' },
      { id: '5', number: '5', name: 'Die Schrottplatz-Könige', p1: 'Patrick', p2: 'Thomas', car: 'Audi TT', pin: '5555', ringHits: [false, false, false, false, false], t1: 0, t2: 0, race1Laps: 0, race2Laps: 0, race3Laps: 0, penalties: 0, penaltyReason: '', customPoints: 0, assignedRefId: '' },
      { id: '6', number: '6', name: 'Kolbenfresser-Crew', p1: 'Matzi', p2: 'Morty', car: 'Opel Astra', pin: '6666', ringHits: [false, false, false, false, false], t1: 0, t2: 0, race1Laps: 0, race2Laps: 0, race3Laps: 0, penalties: 0, penaltyReason: '', customPoints: 0, assignedRefId: '' },
      { id: '7', number: '7', name: 'Kattberger Turbo', p1: 'Flauschi', p2: 'Bjarne', car: 'Golf 4 Variant 4Motion', pin: '7777', ringHits: [false, false, false, false, false], t1: 0, t2: 0, race1Laps: 0, race2Laps: 0, race3Laps: 0, penalties: 0, penaltyReason: '', customPoints: 0, assignedRefId: '' },
      { id: '8', number: '8', name: 'Wiesen-Wühler', p1: 'Jesco', p2: 'Till', car: 'Ford Focus Mk1', pin: '8888', ringHits: [false, false, false, false, false], t1: 0, t2: 0, race1Laps: 0, race2Laps: 0, race3Laps: 0, penalties: 0, penaltyReason: '', customPoints: 0, assignedRefId: '' },
      { id: '9', number: '9', name: 'Kattberger Rennschweine', p1: 'Torben', p2: 'Daniel', car: 'Golf IV', pin: '9999', ringHits: [false, false, false, false, false], t1: 0, t2: 0, race1Laps: 0, race2Laps: 0, race3Laps: 0, penalties: 0, penaltyReason: '', customPoints: 0, assignedRefId: '' },
      { id: '10', number: '10', name: 'Larme Enten', p1: 'Phillip', p2: 'Christoph', car: 'Golf 3', pin: '1010', ringHits: [false, false, false, false, false], t1: 0, t2: 0, race1Laps: 0, race2Laps: 0, race3Laps: 0, penalties: 0, penaltyReason: '', customPoints: 0, assignedRefId: '' },
      { id: '11', number: '11', name: 'Team Plattfuß', p1: 'Flo', p2: 'Matze', car: 'Rennsemmel', pin: '1112', ringHits: [false, false, false, false, false], t1: 0, t2: 0, race1Laps: 0, race2Laps: 0, race3Laps: 0, penalties: 0, penaltyReason: '', customPoints: 0, assignedRefId: '' },
      { id: '12', number: '12', name: 'Cop Killer', p1: 'Lasse', p2: 'Alex', car: 'Rennsemmel', pin: '1212', ringHits: [false, false, false, false, false], t1: 0, t2: 0, race1Laps: 0, race2Laps: 0, race3Laps: 0, penalties: 0, penaltyReason: '', customPoints: 0, assignedRefId: '' }
    ];

    const initialReferees = [
      { id: 'ref1', name: 'Schiri Nord', pin: '1111' },
      { id: 'ref2', name: 'Schiri Süd', pin: '2222' }
    ];

    const getStoredValue = (key, fallback) => {
      try {
        if (typeof window !== 'undefined' && window.localStorage) {
          const saved = localStorage.getItem(`kattberger_${key}`);
          if (saved) return JSON.parse(saved);
        }
      } catch (e) {
        console.error("Error reading localStorage:", e);
      }
      return fallback;
    };

    const generateInitialBracket = (teamList, lapRankings = {}) => {
      const N = teamList.length;
      if (N < 2) return null;

      const sortedByRankAsc = [...teamList].sort((a, b) => {
        const ringA = a.ringHits ? a.ringHits.filter(Boolean).length * 5 : 0;
        const ringB = b.ringHits ? b.ringHits.filter(Boolean).length * 5 : 0;
        const ptsA = ringA + (lapRankings[a.id] || 0) + (a.customPoints || 0) - (a.penalties || 0);
        const ptsB = ringB + (lapRankings[b.id] || 0) + (b.customPoints || 0) - (b.penalties || 0);
        return ptsA - ptsB;
      });

      const seeds = sortedByRankAsc.map(t => t.id);
      const matches = [];
      for (let i = 0; i < N - 1; i++) {
        matches.push({
          id: `gauntlet_m${i}`,
          matchIndex: i,
          t1: i === 0 ? seeds[0] : '',
          t2: seeds[i + 1],
          winner: ''
        });
      }

      return { type: 'gauntlet', seeds, matches };
    };

    const computeGauntletTree = (bracketState) => {
      if (!bracketState || !bracketState.matches) return null;
      const b = JSON.parse(JSON.stringify(bracketState));

      for (let i = 0; i < b.matches.length; i++) {
        const match = b.matches[i];
        match.t2 = b.seeds[i + 1] || '';
        if (i === 0) {
          match.t1 = b.seeds[0] || '';
        } else {
          match.t1 = b.matches[i - 1].winner || '';
        }
        if (match.winner && match.winner !== match.t1 && match.winner !== match.t2) {
          match.winner = '';
        }
      }
      return b;
    };

    const getCatchMeRanks = (teamList, bState) => {
      const ranks = {};
      const N = teamList.length;
      if (N === 0) return ranks;

      const seeds = bState && bState.seeds ? bState.seeds : teamList.map(t => t.id);
      seeds.forEach((id, idx) => { ranks[id] = N - idx; });

      if (bState && bState.matches && bState.matches.length > 0) {
        bState.matches.forEach((m, idx) => {
          if (m.winner) {
            const loser = m.winner === m.t1 ? m.t2 : m.t1;
            if (loser) ranks[loser] = N - idx;
            if (idx === bState.matches.length - 1) ranks[m.winner] = 1;
          }
        });
      }
      return ranks;
    };

    function App() {
      const [teams, setTeams] = useState(() => getStoredValue('teams', initialTeams));
      const [bracket, setBracket] = useState(() => getStoredValue('bracket', generateInitialBracket(initialTeams)));
      const [referees, setReferees] = useState(() => getStoredValue('referees', initialReferees));
      const [adminPin, setAdminPin] = useState(() => getStoredValue('adminPin', '24977'));
      const [isRaceReleased, setIsRaceReleased] = useState(() => getStoredValue('isRaceReleased', false));
      
      const [activeTab, setActiveTab] = useState('leaderboard');
      const [bestLapSortMode, setBestLapSortMode] = useState('number');
      const [activeRaceGrid, setActiveRaceGrid] = useState(1);

      const [role, setRole] = useState('viewer'); 
      const [activeRefId, setActiveRefId] = useState(''); 
      const [activeTeamId, setActiveTeamId] = useState('');

      const [showPinModal, setShowPinModal] = useState(false);
      const [loginType, setLoginType] = useState('admin');
      const [selectedRefId, setSelectedRefId] = useState('');
      const [selectedTeamId, setSelectedTeamId] = useState('');
      const [pinInput, setPinInput] = useState('');
      const [pinError, setPinError] = useState(false);

      const [user, setUser] = useState(null);
      const [dbSynced, setDbSynced] = useState(false);
      const [copiedLink, setCopiedLink] = useState(false);
      const [showShareModal, setShowShareModal] = useState(false);

      const getPublicUrl = () => {
        try {
          if (typeof window !== 'undefined' && window.location && window.location.href) {
            const u = window.location.href;
            if (u && !u.startsWith('about:') && !u.startsWith('blob:') && !u.includes('srcdoc')) {
              return u;
            }
          }
        } catch (e) {}
        return typeof window !== 'undefined' ? window.location.href : '';
      };

      const [shareUrl, setShareUrl] = useState(getPublicUrl);

      const openShareModal = () => {
        const currentUrl = getPublicUrl();
        if (currentUrl) setShareUrl(currentUrl);
        setShowShareModal(true);
      };

      const [confirmModal, setConfirmModal] = useState({ isOpen: false, title: '', message: '', action: null });

      const [editingTeamId, setEditingTeamId] = useState(null);
      const [editNumber, setEditNumber] = useState('');
      const [editName, setEditName] = useState('');
      const [editP1, setEditP1] = useState('');
      const [editP2, setEditP2] = useState('');
      const [editCar, setEditCar] = useState('');
      const [editPin, setEditPin] = useState('');
      const [editCustomPoints, setEditCustomPoints] = useState(0);
      const [editAssignedRefId, setEditAssignedRefId] = useState('');

      const [newTeamNumber, setNewTeamNumber] = useState('');
      const [newTeamName, setNewTeamName] = useState('');
      const [newTeamP1, setNewTeamP1] = useState('');
      const [newTeamP2, setNewTeamP2] = useState('');
      const [newTeamCar, setNewTeamCar] = useState('');
      const [newTeamPin, setNewTeamPin] = useState('');

      const [penaltyTeamId, setPenaltyTeamId] = useState('');
      const [penaltyPoints, setPenaltyPoints] = useState(5);
      const [penaltyText, setPenaltyText] = useState('');

      // REALTIME SYNC: Automatic polling of LocalStorage every 1.5s for instant preview sync
      useEffect(() => {
        const syncInterval = setInterval(() => {
          try {
            const localTeams = localStorage.getItem('kattberger_teams');
            const localBracket = localStorage.getItem('kattberger_bracket');
            const localReleased = localStorage.getItem('kattberger_isRaceReleased');
            
            if (localTeams) {
              const parsedTeams = JSON.parse(localTeams);
              if (JSON.stringify(parsedTeams) !== JSON.stringify(teams)) {
                setTeams(parsedTeams);
              }
            }
            if (localBracket) {
              const parsedBracket = JSON.parse(localBracket);
              if (JSON.stringify(parsedBracket) !== JSON.stringify(bracket)) {
                setBracket(parsedBracket);
              }
            }
            if (localReleased !== null) {
              const parsedReleased = JSON.parse(localReleased);
              if (parsedReleased !== isRaceReleased) {
                setIsRaceReleased(parsedReleased);
              }
            }
          } catch (e) {}
        }, 1500);

        return () => clearInterval(syncInterval);
      }, [teams, bracket, isRaceReleased]);

      useEffect(() => {
        if (!hasFirebase) {
          setDbSynced(false);
          return;
        }

        const initAuthAndSync = async () => {
          try {
            if (typeof window.__initial_auth_token !== 'undefined' && window.__initial_auth_token) {
              await signInWithCustomToken(auth, window.__initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (err) {
            console.error("Auth Fallback Error:", err);
          }
        };

        initAuthAndSync();
        const unsubscribeAuth = onAuthStateChanged(auth, (currentUser) => setUser(currentUser));
        return () => unsubscribeAuth();
      }, []);

      useEffect(() => {
        if (!hasFirebase || !user) return;
        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'raceState', 'main');

        const unsubscribeSnapshot = onSnapshot(docRef, (docSnap) => {
          if (docSnap.exists()) {
            const data = docSnap.data();
            if (data.teams) setTeams(data.teams);
            if (data.bracket) setBracket(data.bracket);
            if (data.referees) setReferees(data.referees);
            if (data.adminPin) setAdminPin(data.adminPin);
            if (typeof data.isRaceReleased === 'boolean') setIsRaceReleased(data.isRaceReleased);
          } else {
            const freshBracket = generateInitialBracket(initialTeams);
            setDoc(docRef, {
              teams: initialTeams,
              bracket: freshBracket,
              referees: initialReferees,
              adminPin: '24977',
              isRaceReleased: false
            }).catch(err => console.error("Error creating initial Cloud db:", err));
          }
          setDbSynced(true);
        }, (error) => {
          console.error("Firestore sync error:", error);
          setDbSynced(false);
        });

        return () => unsubscribeSnapshot();
      }, [user]);

      const saveToCloud = async (newTeams, newBracket = null, newReferees = null, newAdminPin = null, newReleased = null) => {
        if (newTeams) setTeams(newTeams);
        if (newBracket) setBracket(newBracket);
        if (newReferees) setReferees(newReferees);
        if (newAdminPin) setAdminPin(newAdminPin);
        if (typeof newReleased === 'boolean') setIsRaceReleased(newReleased);

        try {
          if (typeof window !== 'undefined' && window.localStorage) {
            if (newTeams) localStorage.setItem('kattberger_teams', JSON.stringify(newTeams));
            if (newBracket) localStorage.setItem('kattberger_bracket', JSON.stringify(newBracket));
            if (newReferees) localStorage.setItem('kattberger_referees', JSON.stringify(newReferees));
            if (newAdminPin) localStorage.setItem('kattberger_adminPin', JSON.stringify(newAdminPin));
            if (typeof newReleased === 'boolean') localStorage.setItem('kattberger_isRaceReleased', JSON.stringify(newReleased));
          }
        } catch (e) {
          console.error("LocalStorage save error:", e);
        }

        if (hasFirebase && user) {
          try {
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'raceState', 'main');
            const updateData = {};
            if (newTeams) updateData.teams = newTeams;
            if (newBracket) updateData.bracket = newBracket;
            if (newReferees) updateData.referees = newReferees;
            if (newAdminPin) updateData.adminPin = newAdminPin;
            if (typeof newReleased === 'boolean') updateData.isRaceReleased = newReleased;
            await setDoc(docRef, updateData, { merge: true });
          } catch (err) {
            console.error("Cloud save error:", err);
          }
        }
      };

      const canEditTeam = (team) => {
        if (!team) return false;
        if (role === 'admin') return true;
        if (role === 'referee' && activeRefId) return team.assignedRefId === activeRefId;
        return false;
      };

      const activeRefObj = useMemo(() => referees.find(r => r.id === activeRefId), [referees, activeRefId]);
      const activeTeamObj = useMemo(() => teams.find(t => t.id === activeTeamId), [teams, activeTeamId]);

      const getRingPoints = (team) => {
        const hitsCount = team.ringHits ? team.ringHits.filter(Boolean).length : 0;
        return hitsCount * 5;
      };

      const getLapTimesRankings = () => {
        const teamsWithTimes = teams
          .filter(t => t.t1 > 0 && t.t2 > 0)
          .map(t => ({ id: t.id, totalTime: t.t1 + t.t2 }))
          .sort((a, b) => a.totalTime - b.totalTime);

        const rankings = {};
        teamsWithTimes.forEach((item, index) => {
          if (index === 0) rankings[item.id] = 30;
          else if (index === 1) rankings[item.id] = 20;
          else if (index === 2) rankings[item.id] = 10;
          else rankings[item.id] = 0;
        });
        return rankings;
      };

      const activeBracketState = useMemo(() => bracket ? computeGauntletTree(bracket) : null, [bracket]);

      const getCatchMePoints = (teamId) => {
        if (!activeBracketState || !activeBracketState.matches || activeBracketState.matches.length === 0) return 0;
        const matches = activeBracketState.matches;
        const finalMatch = matches[matches.length - 1];

        if (finalMatch.winner === teamId) return 30;
        const finalLoser = finalMatch.winner ? (finalMatch.winner === finalMatch.t1 ? finalMatch.t2 : finalMatch.t1) : '';
        if (finalLoser === teamId) return 20;

        if (matches.length >= 2) {
          const semiMatch = matches[matches.length - 2];
          const semiLoser = semiMatch.winner ? (semiMatch.winner === semiMatch.t1 ? semiMatch.t2 : semiMatch.t1) : '';
          if (semiLoser === teamId) return 10;
        }
        return 0;
      };

      const getRacePoints = (team) => {
        if (!isRaceReleased && role !== 'admin') return 0;
        const totalLaps = (team.race1Laps || 0) + (team.race2Laps || 0) + (team.race3Laps || 0);
        return totalLaps * 5;
      };

      const calculateTotalPoints = (team, lapRankings) => {
        const ring = getRingPoints(team);
        const lapBonus = lapRankings[team.id] || 0;
        const catchMe = getCatchMePoints(team.id);
        const racePoints = getRacePoints(team);
        const custom = team.customPoints || 0;
        const penalties = team.penalties || 0;
        return ring + lapBonus + catchMe + racePoints + custom - penalties;
      };

      const getLeaderboard = () => {
        const lapRankings = getLapTimesRankings();
        return [...teams]
          .map(t => ({
            ...t,
            totalPoints: calculateTotalPoints(t, lapRankings),
            ringPoints: getRingPoints(t),
            lapPoints: lapRankings[t.id] || 0,
            catchMePoints: getCatchMePoints(t.id),
            racePoints: getRacePoints(t)
          }))
          .sort((a, b) => b.totalPoints - a.totalPoints);
      };

      const catchMeRanks = useMemo(() => getCatchMeRanks(teams, activeBracketState), [teams, activeBracketState]);

      const gridRace1 = useMemo(() => {
        return [...teams].sort((a, b) => {
          const rA = catchMeRanks[a.id] || 999;
          const rB = catchMeRanks[b.id] || 999;
          return rB - rA;
        });
      }, [teams, catchMeRanks]);

      const gridRace2 = useMemo(() => {
        return [...teams].sort((a, b) => {
          const lapsA = a.race1Laps || 0;
          const lapsB = b.race1Laps || 0;
          if (lapsA !== lapsB) return lapsA - lapsB;
          const rA = catchMeRanks[a.id] || 999;
          const rB = catchMeRanks[b.id] || 999;
          return rB - rA;
        });
      }, [teams, catchMeRanks]);

      const gridRace3 = useMemo(() => {
        return [...teams].sort((a, b) => {
          const lapsA = a.race2Laps || 0;
          const lapsB = b.race2Laps || 0;
          if (lapsA !== lapsB) return lapsA - lapsB;
          const r1A = a.race1Laps || 0;
          const r1B = b.race1Laps || 0;
          if (r1A !== r1B) return r1A - r1B;
          const rA = catchMeRanks[a.id] || 999;
          const rB = catchMeRanks[b.id] || 999;
          return rB - rA;
        });
      }, [teams, catchMeRanks]);

      const getBesteRundeLeaderboard = () => {
        const list = [...teams];
        if (bestLapSortMode === 'number') {
          return list.sort((a, b) => (parseInt(a.number) || 0) - (parseInt(b.number) || 0));
        }
        return list.sort((a, b) => {
          const aHasTimes = a.t1 > 0 && a.t2 > 0;
          const bHasTimes = b.t1 > 0 && b.t2 > 0;
          if (aHasTimes && !bHasTimes) return -1;
          if (!aHasTimes && bHasTimes) return 1;
          if (!aHasTimes && !bHasTimes) return 0;
          return (a.t1 + a.t2) - (b.t1 + b.t2);
        });
      };

      const canEditMatch = (match) => {
        if (!match) return false;
        if (role === 'admin') return true;
        if (role === 'referee' && activeRefId) {
          const t1Obj = teams.find(t => t.id === match.t1);
          const t2Obj = teams.find(t => t.id === match.t2);
          return (t1Obj && t1Obj.assignedRefId === activeRefId) || (t2Obj && t2Obj.assignedRefId === activeRefId);
        }
        return false;
      };

      const toggleRingHit = (teamId, attemptIndex) => {
        const team = teams.find(t => t.id === teamId);
        if (!team || !canEditTeam(team)) return;

        const newTeams = teams.map(t => {
          if (t.id === teamId) {
            const newHits = [...(t.ringHits || [false, false, false, false, false])];
            newHits[attemptIndex] = !newHits[attemptIndex];
            return { ...t, ringHits: newHits };
          }
          return t;
        });
        saveToCloud(newTeams);
      };

      const saveDriverTime = (teamId, driverKey, seconds) => {

                      <input type="text" placeholder="Teamname" value={newTeamName} onChange={(e) => setNewTeamName(e.target.value)} className="bg-zinc-950 border border-zinc-800 rounded p-2 text-xs text-zinc-100 sm:col-span-2" required />
                      <input type="text" placeholder="Fahrer 1" value={newTeamP1} onChange={(e) => setNewTeamP1(e.target.value)} className="bg-zinc-950 border border-zinc-800 rounded p-2 text-xs text-zinc-100" />
                      <input type="text" placeholder="Fahrer 2" value={newTeamP2} onChange={(e) => setNewTeamP2(e.target.value)} className="bg-zinc-950 border border-zinc-800 rounded p-2 text-xs text-zinc-100" />
                      <input type="text" placeholder="Fahrzeug" value={newTeamCar} onChange={(e) => setNewTeamCar(e.target.value)} className="bg-zinc-950 border border-zinc-800 rounded p-2 text-xs text-zinc-100" />
                    </div>
                    <button type="submit" className="w-full bg-amber-500 hover:bg-amber-600 text-black font-extrabold text-xs py-2 rounded transition uppercase tracking-wider">Team registrieren</button>
                  </form>
                )}

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {teams.map((team) => {
                    const isMyRefTeam = role === 'referee' && team.assignedRefId === activeRefId;
                    const isMyOwnTeam = role === 'team' && team.id === activeTeamId;
                    return (
                      <div key={team.id} className={`border p-4 rounded-xl space-y-3 relative overflow-hidden transition duration-300 ${isMyRefTeam ? 'border-emerald-500 bg-emerald-950/20' : isMyOwnTeam ? 'border-blue-500 bg-blue-950/20' : 'border-zinc-800 bg-zinc-900/40'}`}>
                        <div className="absolute top-0 right-0 bg-zinc-950 text-amber-400 font-mono text-[10px] font-black px-2.5 py-0.5 rounded-bl border-l border-b border-zinc-800">#{team.number}</div>
                        {editingTeamId === team.id ? (
                          <form onSubmit={saveTeamSetup} className="space-y-2.5 pt-1">
                            <div className="grid grid-cols-3 gap-2">
                              <div><label className="text-[10px] uppercase font-bold text-zinc-500">Nr.</label><input type="text" value={editNumber} onChange={(e) => setEditNumber(e.target.value)} className="w-full bg-zinc-950 border border-zinc-800 p-1.5 rounded text-xs text-zinc-100 font-mono" /></div>
                              <div className="col-span-2"><label className="text-[10px] uppercase font-bold text-zinc-500">Name</label><input type="text" value={editName} onChange={(e) => setEditName(e.target.value)} className="w-full bg-zinc-950 border border-zinc-800 p-1.5 rounded text-xs text-zinc-100" required /></div>
                            </div>
                            <div className="grid grid-cols-2 gap-2">
                              <div><label className="text-[10px] uppercase font-bold text-zinc-500">F1</label><input type="text" value={editP1} onChange={(e) => setEditP1(e.target.value)} className="w-full bg-zinc-950 border border-zinc-800 p-1.5 rounded text-xs text-zinc-100" required /></div>
                              <div><label className="text-[10px] uppercase font-bold text-zinc-500">F2</label><input type="text" value={editP2} onChange={(e) => setEditP2(e.target.value)} className="w-full bg-zinc-950 border border-zinc-800 p-1.5 rounded text-xs text-zinc-100" required /></div>
                            </div>
                            <div><label className="text-[10px] uppercase font-bold text-zinc-500">KFZ</label><input type="text" value={editCar} onChange={(e) => setEditCar(e.target.value)} className="w-full bg-zinc-950 border border-zinc-800 p-1.5 rounded text-xs text-zinc-100" /></div>
                            <div className="flex gap-1.5 pt-1">
                              <button type="button" onClick={() => setEditingTeamId(null)} className="flex-1 py-1 bg-zinc-800 text-zinc-300 rounded text-xs font-bold">Abbrechen</button>
                              <button type="submit" className="flex-1 py-1 bg-amber-500 text-black rounded text-xs font-bold flex items-center justify-center gap-1"><Save className="w-3.5 h-3.5" /> Speichern</button>
                            </div>
                          </form>
                        ) : (
                          <div className="pt-2">
                            <div className="flex items-center gap-2 mb-1 flex-wrap">
                              <h3 className="font-extrabold text-sm text-zinc-100">#{team.number} {team.name}</h3>
                              {isMyRefTeam && (<span className="bg-emerald-500 text-black text-[10px] font-black px-1.5 py-0.5 rounded uppercase">Dein Team</span>)}
                            </div>
                            <div className="text-xs text-zinc-400 space-y-0.5">
                              <p>Fahrer: <strong className="text-zinc-300">{team.p1} & {team.p2}</strong></p>
                              {team.car && (<p className="text-amber-500">KFZ: <strong>{team.car}</strong></p>)}
                            </div>
                            {role === 'admin' && (
                              <div className="mt-4 pt-2.5 border-t border-zinc-800 flex justify-between gap-2">
                                <button type="button" onClick={() => triggerDeleteTeam(team.id, team.name)} className="bg-zinc-950 text-zinc-500 hover:text-red-400 p-2 rounded text-xs transition"><Trash2 className="w-4 h-4" /></button>
                                <button type="button" onClick={() => startEditingTeam(team)} className="flex-1 bg-zinc-950 text-zinc-300 px-3 py-1.5 rounded text-xs font-semibold flex items-center justify-center gap-1.5 transition"><Edit3 className="w-3.5 h-3.5 text-amber-500" /> Bearbeiten</button>
                              </div>
                            )}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {activeTab === 'ringstechen' && (
              <div className="space-y-4">
                <div className="border-b border-zinc-800 pb-2">
                  <h2 className="text-xl font-extrabold uppercase text-amber-400">🎯 Disziplin 1: Ringstechen</h2>
                  <p className="text-xs text-zinc-400 mt-1">Jedes Team hat **5 Versuche**. Jeder erfolgreiche Treffer bringt **5 Punkte**.</p>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {teams.filter(team => role !== 'team' || team.id === activeTeamId).map(team => {
                    const hitsCount = team.ringHits ? team.ringHits.filter(Boolean).length : 0;
                    const isEditable = canEditTeam(team);
                    return (
                      <div key={team.id} className="border border-zinc-800 bg-zinc-900/40 p-4 rounded-xl flex items-center justify-between gap-4">
                        <div>
                          <span className="font-extrabold text-zinc-100 text-sm">#{team.number} {team.name}</span>
                          <div className="text-xs text-amber-400 font-bold mt-1 font-mono">{hitsCount} Treffer = {hitsCount * 5} Punkte</div>
                        </div>
                        <div className="flex items-center gap-1.5">
                          {(team.ringHits || [false, false, false, false, false]).map((hit, attemptIdx) => (
                            <button key={attemptIdx} disabled={!isEditable} onClick={() => toggleRingHit(team.id, attemptIdx)} className={`w-9 h-9 rounded-lg font-black text-xs transition border flex items-center justify-center ${hit ? 'bg-amber-500 border-amber-600 text-black' : 'bg-zinc-950 border-zinc-800 text-zinc-600'} ${!isEditable ? 'cursor-default opacity-50' : 'hover:border-zinc-700'}`}>
                              {hit ? '✔' : attemptIdx + 1}
                            </button>
                          ))}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {activeTab === 'schnellsteRunde' && (
              <div className="space-y-6">
                <div className="border-b border-zinc-800 pb-2 flex justify-between items-center">
                  <h2 className="text-xl font-extrabold uppercase text-amber-400">⏱ Disziplin 2: Beste Runde</h2>
                  <div className="flex bg-zinc-900 border border-zinc-800 p-1 rounded-lg text-xs font-bold">
                    <button type="button" onClick={() => setBestLapSortMode('number')} className={`px-3 py-1 rounded transition ${bestLapSortMode === 'number' ? 'bg-amber-500 text-black' : 'text-zinc-400'}`}>Startnr.</button>
                    <button type="button" onClick={() => setBestLapSortMode('time')} className={`px-3 py-1 rounded transition ${bestLapSortMode === 'time' ? 'bg-amber-500 text-black' : 'text-zinc-400'}`}>Bestzeit</button>
                  </div>
                </div>
                <div className="bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden">
                  <table className="w-full text-left border-collapse text-xs">
                    <thead>
                      <tr className="bg-zinc-950 text-[10px] uppercase text-zinc-500 border-b border-zinc-800">
                        <th className="p-3 text-center w-12">Pos</th><th className="p-3">Team</th><th className="p-3">Zeit F1 (s)</th><th className="p-3">Zeit F2 (s)</th><th className="p-3 text-center">Gesamtzeit</th><th className="p-3 text-center text-amber-400">Punkte</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-zinc-800">
                      {getBesteRundeLeaderboard().filter(team => role !== 'team' || team.id === activeTeamId).map((team, idx) => {
                        const total = team.t1 > 0 && team.t2 > 0 ? (team.t1 + team.t2).toFixed(2) : null;
                        const bonus = getLapTimesRankings()[team.id] || 0;
                        const isEditable = canEditTeam(team);
                        return (
                          <tr key={team.id} className="hover:bg-zinc-900/40 transition">
                            <td className="p-3 text-center font-mono font-bold">{idx + 1}</td>
                            <td className="p-3"><span className="font-bold text-zinc-200">#{team.number} {team.name}</span></td>
                            <td className="p-3">{isEditable ? <input type="number" step="0.01" value={team.t1 || ''} onChange={(e) => saveDriverTime(team.id, 't1', e.target.value)} className="w-24 bg-zinc-950 border border-zinc-800 p-1 rounded font-mono text-center text-zinc-200" /> : <span className="font-mono">{team.t1}s</span>}</td>
                            <td className="p-3">{isEditable ? <input type="number" step="0.01" value={team.t2 || ''} onChange={(e) => saveDriverTime(team.id, 't2', e.target.value)} className="w-24 bg-zinc-950 border border-zinc-800 p-1 rounded font-mono text-center text-zinc-200" /> : <span className="font-mono">{team.t2}s</span>}</td>
                            <td className="p-3 text-center font-mono font-bold">{total ? `${total}s` : '-'}</td>
                            <td className="p-3 text-center font-bold text-amber-400">{bonus > 0 ? `+${bonus}` : '-'}</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {activeTab === 'catchMe' && (
              <div className="space-y-6">
                <div className="border-b border-zinc-800 pb-2 flex justify-between items-center">
                  <h2 className="text-xl font-extrabold uppercase text-amber-400">⚔ Disziplin 3: Catch Me If You Can</h2>
                  {role === 'admin' && teams.length >= 2 && (
                    <button type="button" onClick={handleShuffleBracket} className="bg-zinc-800 text-zinc-300 text-xs font-bold px-3 py-1.5 rounded transition flex items-center gap-1.5">
                      <RefreshCw className="w-3.5 h-3.5 text-amber-500" /> Aus Zwischenstand aufbauen
                    </button>
                  )}
                </div>
                {activeBracketState && (
                  <div className="space-y-4">
                    {activeBracketState.matches.map((match, idx) => {
                      const canEdit = canEditMatch(match);
                      return (
                        <div key={match.id} className="border border-zinc-800 bg-zinc-900 rounded-xl p-4 space-y-3">
                          <span className="text-[10px] bg-zinc-950 text-amber-400 px-2.5 py-0.5 rounded font-bold font-mono uppercase">Duell #{idx + 1}</span>
                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <button type="button" disabled={!canEdit || !match.t1} onClick={() => handleSetGauntletWinner(idx, match.t1)} className={`p-3 rounded-lg border text-left flex items-center justify-between ${match.winner === match.t1 ? 'bg-amber-500 text-black font-extrabold' : 'bg-zinc-950 border-zinc-800 text-zinc-300'}`}>
                              <span>{getTeamName(match.t1)}</span> {match.winner === match.t1 && <span className="text-[10px] bg-black text-amber-400 px-2 py-0.5 rounded font-black">SIEG</span>}
                            </button>
                            <button type="button" disabled={!canEdit || !match.t2} onClick={() => handleSetGauntletWinner(idx, match.t2)} className={`p-3 rounded-lg border text-left flex items-center justify-between ${match.winner === match.t2 ? 'bg-amber-500 text-black font-extrabold' : 'bg-zinc-950 border-zinc-800 text-zinc-300'}`}>
                              <span>{getTeamName(match.t2)}</span> {match.winner === match.t2 && <span className="text-[10px] bg-black text-amber-400 px-2 py-0.5 rounded font-black">SIEG</span>}
                            </button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}

            {activeTab === 'hauptrennen' && (
              <div className="space-y-6">
                <div className="border-b border-zinc-800 pb-2">
                  <h2 className="text-xl font-extrabold uppercase text-amber-400">🏁 Disziplin 4: Hauptrennen</h2>
                </div>
                <div className="bg-zinc-900 border border-zinc-800 rounded-xl p-5 space-y-4">
                  <div className="flex justify-between items-center">
                    <h3 className="text-sm font-black uppercase text-amber-400">Startaufstellung (Reversed Grid)</h3>
                    <div className="flex bg-zinc-950 p-1 rounded-lg border border-zinc-800 text-xs font-bold">
                      <button onClick={() => setActiveRaceGrid(1)} className={`px-3 py-1.5 rounded transition ${activeRaceGrid === 1 ? 'bg-amber-500 text-black' : 'text-zinc-400'}`}>Lauf 1</button>
                      <button onClick={() => setActiveRaceGrid(2)} className={`px-3 py-1.5 rounded transition ${activeRaceGrid === 2 ? 'bg-amber-500 text-black' : 'text-zinc-400'}`}>Lauf 2</button>
                      <button onClick={() => setActiveRaceGrid(3)} className={`px-3 py-1.5 rounded transition ${activeRaceGrid === 3 ? 'bg-amber-500 text-black' : 'text-zinc-400'}`}>Lauf 3</button>
                    </div>
                  </div>
                  <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-2">
                    {currentGrid.map((team, index) => (
                      <div key={team.id} className="p-2.5 bg-zinc-950 rounded border border-zinc-800 flex flex-col justify-between">
                        <span className="font-mono text-xl font-black text-amber-400">#{index + 1}</span>
                        <span className="font-bold text-zinc-200 text-xs truncate mt-1">#{team.number} {team.name}</span>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden">
                  <div className="p-4 bg-zinc-950 border-b border-zinc-800"><span className="text-xs font-bold uppercase text-zinc-300">Rundeneingabe</span></div>
                  <div className="divide-y divide-zinc-800">
                    {teams.map(team => {
                      const isEditable = canEditTeam(team);
                      return (
                        <div key={team.id} className="p-4 flex items-center justify-between gap-4">
                          <div><span className="font-extrabold text-sm">#{team.number} {team.name}</span></div>
                          <div className="flex gap-3">
                            <div className="bg-zinc-950 p-2 rounded border border-zinc-800 text-center w-24">
                              <span className="text-[9px] text-zinc-500 block">R1</span>
                              <div className="flex justify-center items-center gap-1 mt-1">
                                {isEditable && <button onClick={() => updateRaceLaps(team.id, 'race1Laps', -1)} className="px-1.5 bg-zinc-800 rounded">-</button>}
                                <span className="font-mono font-bold text-sm">{team.race1Laps || 0}</span>
                                {isEditable && <button onClick={() => updateRaceLaps(team.id, 'race1Laps', 1)} className="px-1.5 bg-zinc-800 rounded">+</button>}
                              </div>
                            </div>
                            <div className="bg-zinc-950 p-2 rounded border border-zinc-800 text-center w-24">
                              <span className="text-[9px] text-zinc-500 block">R2</span>
                              <div className="flex justify-center items-center gap-1 mt-1">
                                {isEditable && <button onClick={() => updateRaceLaps(team.id, 'race2Laps', -1)} className="px-1.5 bg-zinc-800 rounded">-</button>}
                                <span className="font-mono font-bold text-sm">{team.race2Laps || 0}</span>
                                {isEditable && <button onClick={() => updateRaceLaps(team.id, 'race2Laps', 1)} className="px-1.5 bg-zinc-800 rounded">+</button>}
                              </div>
                            </div>
                            <div className="bg-zinc-950 p-2 rounded border border-zinc-800 text-center w-24">
                              <span className="text-[9px] text-zinc-500 block">R3</span>
                              <div className="flex justify-center items-center gap-1 mt-1">
                                {isEditable && <button onClick={() => updateRaceLaps(team.id, 'race3Laps', -1)} className="px-1.5 bg-zinc-800 rounded">-</button>}
                                <span className="font-mono font-bold text-sm">{team.race3Laps || 0}</span>
                                {isEditable && <button onClick={() => updateRaceLaps(team.id, 'race3Laps', 1)} className="px-1.5 bg-zinc-800 rounded">+</button>}
                              </div>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'regeln' && (
              <div className="space-y-6">
                <div className="border-b border-zinc-800 pb-2"><h2 className="text-xl font-extrabold uppercase text-amber-400">📜 Offizielles Regelwerk 2026</h2></div>
                <div className="bg-zinc-900 border border-zinc-800 p-5 rounded-xl space-y-2">
                  <p className="text-xs text-zinc-300">Alle Punkte und Platzierungen werden automatisch in Echtzeit über das Live-Board für alle Kumpels und Zuschauer synchronisiert.</p>
                </div>
              </div>
            )}

          </main>

          {showPinModal && (
            <div className="fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-50">
              <form onSubmit={handleLoginSubmit} className="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 w-full max-w-sm space-y-4">
                <div className="text-center"><Lock className="w-10 h-10 text-amber-500 mx-auto mb-2" /><h3 className="font-black text-lg uppercase">Login</h3></div>
                <div className="flex bg-zinc-950 p-1 rounded-lg border border-zinc-800 text-xs font-bold">
                  <button type="button" onClick={() => setLoginType('admin')} className={`flex-1 py-1.5 rounded ${loginType === 'admin' ? 'bg-amber-500 text-black' : 'text-zinc-500'}`}>Admin</button>
                  <button type="button" onClick={() => setLoginType('referee')} className={`flex-1 py-1.5 rounded ${loginType === 'referee' ? 'bg-emerald-500 text-black' : 'text-zinc-500'}`}>Schiri</button>
                  <button type="button" onClick={() => setLoginType('team')} className={`flex-1 py-1.5 rounded ${loginType === 'team' ? 'bg-blue-500 text-white' : 'text-zinc-500'}`}>Team</button>
                </div>
                {loginType === 'referee' && (<select value={selectedRefId} onChange={(e) => setSelectedRefId(e.target.value)} className="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-sm text-zinc-100">{referees.map(r => (<option key={r.id} value={r.id}>{r.name}</option>))}</select>)}
                {loginType === 'team' && (<select value={selectedTeamId} onChange={(e) => setSelectedTeamId(e.target.value)} className="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-sm text-zinc-100">{teams.map(t => (<option key={t.id} value={t.id}>#{t.number} {t.name}</option>))}</select>)}
                <input type="password" placeholder="PIN" value={pinInput} onChange={(e) => setPinInput(e.target.value)} className="w-full bg-zinc-950 border border-zinc-800 rounded p-2.5 text-center text-lg font-mono text-zinc-100" required />
                {pinError && <span className="text-red-500 text-xs font-bold block text-center">Falscher PIN!</span>}
                <div className="flex gap-2">
                  <button type="button" onClick={() => setShowPinModal(false)} className="flex-1 py-2 bg-zinc-800 rounded text-xs font-bold">Abbrechen</button>
                  <button type="submit" className="flex-1 py-2 bg-amber-500 text-black rounded text-xs font-bold">Einloggen</button>
                </div>
              </form>
            </div>
          )}

          {confirmModal.isOpen && (
            <div className="fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-50">
              <div className="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 w-full max-w-sm text-center space-y-4">
                <AlertTriangle className="w-12 h-10 text-amber-500 mx-auto" />
                <h3 className="font-black text-lg uppercase">{confirmModal.title}</h3>
                <p className="text-xs text-zinc-400">{confirmModal.message}</p>
                <div className="flex gap-2.5">
                  <button type="button" onClick={() => setConfirmModal({ isOpen: false, title: '', message: '', action: null })} className="flex-1 py-2 bg-zinc-800 rounded text-xs font-bold">Abbrechen</button>
                  <button type="button" onClick={confirmModal.action} className="flex-1 py-2 bg-red-600 text-white rounded text-xs font-bold">Ja</button>
                </div>
              </div>
            </div>
          )}

          {showShareModal && (
            <div className="fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-50">
              <div className="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 w-full max-w-sm text-center space-y-4">
                <h3 className="font-black text-lg uppercase text-amber-400">Handys live koppeln!</h3>
                <div className="bg-white p-3 rounded-xl inline-block mx-auto border border-zinc-800">
                  <img src={`https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(shareUrl || getPublicUrl() || window.location.href)}`} alt="QR-Code" className="w-48 h-48 block mx-auto" />
                </div>
                <input type="text" value={shareUrl} onChange={(e) => setShareUrl(e.target.value)} className="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-xs text-amber-400 font-mono" />
                <button type="button" onClick={copyShareLink} className="w-full py-2 bg-zinc-800 text-zinc-200 rounded text-xs font-bold">{copiedLink ? 'Link kopiert!' : 'Link kopieren'}</button>
                <button type="button" onClick={() => setShowShareModal(false)} className="w-full py-2 bg-amber-500 text-black rounded text-xs font-bold">Zurück</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
