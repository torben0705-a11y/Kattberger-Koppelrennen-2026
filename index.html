<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kattberger Koppelrennen 2026</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone (für JSX im Browser) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase App & Database -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    body {
      background-color: #09090b;
      color: #f4f4f5;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Standard-Startteams mit Fahrern & Beifahrern
    const INITIAL_TEAMS = [
      { id: '1', number: '1', name: 'Ackerschreck', driver: 'Torben Witt', coDriver: 'Dennis', car: 'VW Golf 4 Variant 4Motion', score: 0, ringScore: 0, lapTime1: '', lapTime2: '', mainLaps: [0, 0, 0] },
      { id: '2', number: '2', name: 'Schlamm-Crasher', driver: 'Kalle', coDriver: 'Marten', car: 'Audi 80 Quattro', score: 0, ringScore: 0, lapTime1: '', lapTime2: '', mainLaps: [0, 0, 0] },
      { id: '3', number: '3', name: 'Dosenbier-Express', driver: 'Jan', coDriver: 'Bastian', car: 'Opel Astra G', score: 0, ringScore: 0, lapTime1: '', lapTime2: '', mainLaps: [0, 0, 0] },
      { id: '4', number: '4', name: 'Feld-Flitzer', driver: 'Lukas', coDriver: 'Nico', car: 'Ford Focus', score: 0, ringScore: 0, lapTime1: '', lapTime2: '', mainLaps: [0, 0, 0] }
    ];

    const DISC_INFO = {
      ring: {
        title: "1. Ringstechen",
        desc: "Präzision & Tempo auf der Koppel! Der Beifahrer muss während der Fahrt Ringe mit einer Lanze stechen. Jeder getroffene Ring bringt wertvolle Punkte für die Gesamtwertung."
      },
      time: {
        title: "2. Beste Runde",
        desc: "Die Uhr tickt! Beide Fahrer legen nacheinander eine fliegende Runde auf dem Kurs hin. Die Zeiten beider Fahrer werden zusammengezählt. Das schnellste Gespann gewinnt."
      },
      ko: {
        title: "3. Catch Me If You Can",
        desc: "Direktes Duell Stoßstange an Stoßstange! Alle Teams starten in der 1. Runde. Wer die Ziellinie zuerst überquert, zieht direkt ins nächste K.O.-Rennen ein."
      },
      main: {
        title: "4. Hauptrennen",
        desc: "Das große Finale über 3 Durchgänge mit Reversed Grid (umgekehrte Startaufstellung im 2. Lauf). Spannung bis zur letzten Runde!"
      }
    };

    function App() {
      const [role, setRole] = useState('user'); // 'user', 'referee', 'admin'
      const [pinInput, setPinInput] = useState('');
      const [activeTab, setActiveTab] = useState('ring');
      const [teams, setTeams] = useState(INITIAL_TEAMS);
      const [showMainResult, setShowMainResult] = useState(false);
      const [timeSortMode, setTimeSortMode] = useState('number'); // 'number' oder 'time'
      const [showQrModal, setShowQrModal] = useState(false);
      const [manualUrl, setManualUrl] = useState('https://torben0705-a11y.github.io/Kattberger-Koppelrennen-2026');

      // Neues Team Formular
      const [newNum, setNewNum] = useState('');
      const [newName, setNewName] = useState('');
      const [newDriver, setNewDriver] = useState('');
      const [newCoDriver, setNewCoDriver] = useState('');
      const [newCar, setNewCar] = useState('');

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [activeTab, role, teams, showQrModal]);

      const handleLogin = (e) => {
        e.preventDefault();
        if (pinInput === '24977') {
          setRole('admin');
          setPinInput('');
        } else if (pinInput === '1234') {
          setRole('referee');
          setPinInput('');
        } else {
          alert('Falscher PIN! (Rennleitung: 24977 | Schiedsrichter: 1234)');
        }
      };

      const addTeam = (e) => {
        e.preventDefault();
        if (!newName) return;
        const team = {
          id: Date.now().toString(),
          number: newNum || (teams.length + 1).toString(),
          name: newName,
          driver: newDriver || 'Fahrer',
          coDriver: newCoDriver || 'Beifahrer',
          car: newCar || 'Rennbolide',
          score: 0,
          ringScore: 0,
          lapTime1: '',
          lapTime2: '',
          mainLaps: [0, 0, 0]
        };
        setTeams([...teams, team]);
        setNewNum(''); setNewName(''); setNewDriver(''); setNewCoDriver(''); setNewCar('');
      };

      const updateTeamField = (id, field, val) => {
        setTeams(teams.map(t => t.id === id ? { ...t, [field]: val } : t));
      };

      const deleteTeam = (id) => {
        if (confirm('Team wirklich löschen?')) {
          setTeams(teams.filter(t => t.id !== id));
        }
      };

      // Berechnungen für Beste Runde
      const getTeamTotalTime = (t) => {
        const t1 = parseFloat(t.lapTime1.replace(',', '.')) || 0;
        const t2 = parseFloat(t.lapTime2.replace(',', '.')) || 0;
        return t1 && t2 ? t1 + t2 : 0;
      };

      const sortedTimeTeams = [...teams].sort((a, b) => {
        if (timeSortMode === 'number') {
          return parseInt(a.number || 0) - parseInt(b.number || 0);
        } else {
          const ta = getTeamTotalTime(a);
          const tb = getTeamTotalTime(b);
          if (ta === 0) return 1;
          if (tb === 0) return -1;
          return ta - tb;
        }
      });

      const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(manualUrl)}`;

      return (
        <div className="min-h-screen bg-zinc-950 text-zinc-100 flex flex-col">
          {/* Header */}
          <header className="bg-zinc-900 border-b border-zinc-800 p-4 sticky top-0 z-40">
            <div className="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-3">
              <div>
                <h1 className="text-xl font-bold tracking-wider text-amber-500 uppercase flex items-center gap-2">
                  <span>🏎️</span> Kattberger Koppelrennen 2026
                </h1>
                <p className="text-xs text-zinc-400">Live Dashboard & Rennleitung</p>
              </div>

              <div className="flex items-center gap-2">
                <button 
                  onClick={() => setShowQrModal(true)}
                  className="bg-zinc-800 hover:bg-zinc-700 text-xs px-3 py-1.5 rounded-lg border border-zinc-700 flex items-center gap-1.5"
                >
                  <span>📱</span> Handys koppeln
                </button>

                {role === 'user' ? (
                  <form onSubmit={handleLogin} className="flex items-center gap-1.5">
                    <input 
                      type="password" 
                      placeholder="PIN" 
                      value={pinInput}
                      onChange={(e) => setPinInput(e.target.value)}
                      className="w-16 bg-zinc-950 border border-zinc-800 text-center text-xs py-1.5 rounded-lg focus:outline-none focus:border-amber-500"
                    />
                    <button type="submit" className="bg-amber-600 hover:bg-amber-500 text-xs font-semibold px-2.5 py-1.5 rounded-lg text-black">
                      Login
                    </button>
                  </form>
                ) : (
                  <div className="flex items-center gap-2">
                    <span className="text-xs bg-amber-500/10 text-amber-500 border border-amber-500/30 px-2 py-1 rounded">
                      {role === 'admin' ? '👑 Rennleitung' : '🏁 Schiedsrichter'}
                    </span>
                    <button 
                      onClick={() => setRole('user')} 
                      className="text-xs text-zinc-400 hover:text-white underline"
                    >
                      Abmelden
                    </button>
                  </div>
                )}
              </div>
            </div>
          </header>

          {/* Navigation */}
          <nav className="bg-zinc-900/80 border-b border-zinc-800 backdrop-blur sticky top-[65px] z-30">
            <div className="max-w-5xl mx-auto flex overflow-x-auto no-scrollbar text-sm font-medium">
              <button onClick={() => setActiveTab('ring')} className={`px-4 py-3 border-b-2 whitespace-nowrap transition-colors ${activeTab === 'ring' ? 'border-amber-500 text-amber-500' : 'border-transparent text-zinc-400 hover:text-zinc-200'}`}>🎯 Ringstechen</button>
              <button onClick={() => setActiveTab('time')} className={`px-4 py-3 border-b-2 whitespace-nowrap transition-colors ${activeTab === 'time' ? 'border-amber-500 text-amber-500' : 'border-transparent text-zinc-400 hover:text-zinc-200'}`}>⏱️ Beste Runde</button>
              <button onClick={() => setActiveTab('ko')} className={`px-4 py-3 border-b-2 whitespace-nowrap transition-colors ${activeTab === 'ko' ? 'border-amber-500 text-amber-500' : 'border-transparent text-zinc-400 hover:text-zinc-200'}`}>⚔️ Catch Me</button>
              <button onClick={() => setActiveTab('main')} className={`px-4 py-3 border-b-2 whitespace-nowrap transition-colors ${activeTab === 'main' ? 'border-amber-500 text-amber-500' : 'border-transparent text-zinc-400 hover:text-zinc-200'}`}>🏆 Hauptrennen</button>
              <button onClick={() => setActiveTab('teams')} className={`px-4 py-3 border-b-2 whitespace-nowrap transition-colors ${activeTab === 'teams' ? 'border-amber-500 text-amber-500' : 'border-transparent text-zinc-400 hover:text-zinc-200'}`}>🚘 Teams ({teams.length})</button>
              <button onClick={() => setActiveTab('rules')} className={`px-4 py-3 border-b-2 whitespace-nowrap transition-colors ${activeTab === 'rules' ? 'border-amber-500 text-amber-500' : 'border-transparent text-zinc-400 hover:text-zinc-200'}`}>📜 Regelwerk</button>
            </div>
          </nav>

          {/* Main Content */}
          <main className="flex-1 max-w-5xl w-full mx-auto p-4 space-y-6">

            {/* Banner Description */}
            {DISC_INFO[activeTab] && (
              <div className="bg-zinc-900 border border-zinc-800 rounded-xl p-4">
                <h2 className="text-lg font-bold text-amber-400 mb-1">{DISC_INFO[activeTab].title}</h2>
                <p className="text-sm text-zinc-300">{DISC_INFO[activeTab].desc}</p>
              </div>
            )}

            {/* TAB: RINGSTECHEN */}
            {activeTab === 'ring' && (
              <div className="space-y-4">
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {teams.map(t => (
                    <div key={t.id} className="bg-zinc-900 border border-zinc-800 rounded-xl p-4 flex flex-col justify-between">
                      <div>
                        <div className="flex items-center justify-between mb-2">
                          <span className="text-amber-500 font-bold text-lg">#{t.number} {t.name}</span>
                          <span className="text-xs bg-zinc-800 px-2 py-1 rounded text-zinc-300">{t.car}</span>
                        </div>
                        <p className="text-xs text-zinc-400 mb-3">👤 Fahrer: {t.driver} | 🤝 Beifahrer: {t.coDriver}</p>
                      </div>

                      <div className="flex items-center justify-between border-t border-zinc-800 pt-3">
                        <span className="text-sm text-zinc-300">Gestochene Ringe:</span>
                        {role !== 'user' ? (
                          <div className="flex items-center gap-2">
                            <button onClick={() => updateTeamField(t.id, 'ringScore', Math.max(0, (t.ringScore || 0) - 1))} className="w-8 h-8 bg-zinc-800 hover:bg-zinc-700 rounded-lg text-lg font-bold">-</button>
                            <span className="w-8 text-center font-bold text-amber-400 text-lg">{t.ringScore || 0}</span>
                            <button onClick={() => updateTeamField(t.id, 'ringScore', (t.ringScore || 0) + 1)} className="w-8 h-8 bg-zinc-800 hover:bg-zinc-700 rounded-lg text-lg font-bold">+</button>
                          </div>
                        ) : (
                          <span className="font-bold text-amber-400 text-xl">{t.ringScore || 0} Pkt</span>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB: BESTE RUNDE */}
            {activeTab === 'time' && (
              <div className="space-y-4">
                <div className="flex justify-end mb-2">
                  <div className="bg-zinc-900 border border-zinc-800 rounded-lg p-1 flex gap-1 text-xs">
                    <button 
                      onClick={() => setTimeSortMode('number')}
                      className={`px-3 py-1 rounded ${timeSortMode === 'number' ? 'bg-amber-600 text-black font-semibold' : 'text-zinc-400'}`}
                    >
                      🔢 Startnr. (Stabil)
                    </button>
                    <button 
                      onClick={() => setTimeSortMode('time')}
                      className={`px-3 py-1 rounded ${timeSortMode === 'time' ? 'bg-amber-600 text-black font-semibold' : 'text-zinc-400'}`}
                    >
                      🏆 Bestzeit
                    </button>
                  </div>
                </div>

                <div className="space-y-3">
                  {sortedTimeTeams.map((t, idx) => {
                    const total = getTeamTotalTime(t);
                    return (
                      <div key={t.id} className="bg-zinc-900 border border-zinc-800 rounded-xl p-4 flex flex-wrap items-center justify-between gap-4">
                        <div className="min-w-[200px]">
                          <div className="flex items-center gap-2">
                            <span className="text-xs bg-amber-500/10 text-amber-400 px-2 py-0.5 rounded border border-amber-500/20 font-bold">
                              #{t.number}
                            </span>
                            <h3 className="font-bold text-zinc-100">{t.name}</h3>
                          </div>
                          <p className="text-xs text-zinc-400 mt-1">🏎️ {t.driver} & {t.coDriver} ({t.car})</p>
                        </div>

                        <div className="flex flex-wrap items-center gap-4">
                          <div>
                            <label className="block text-[10px] text-zinc-500 uppercase">Fahrer 1 Zeit</label>
                            {role !== 'user' ? (
                              <input 
                                type="text" 
                                value={t.lapTime1 || ''} 
                                onChange={(e) => updateTeamField(t.id, 'lapTime1', e.target.value)}
                                placeholder="Sek. (z.B. 42.5)" 
                                className="w-28 bg-zinc-950 border border-zinc-800 text-center text-sm py-1 rounded focus:border-amber-500 text-zinc-100"
                              />
                            ) : (
                              <span className="text-sm font-semibold">{t.lapTime1 ? `${t.lapTime1}s` : '--'}</span>
                            )}
                          </div>

                          <div>
                            <label className="block text-[10px] text-zinc-500 uppercase">Fahrer 2 Zeit</label>
                            {role !== 'user' ? (
                              <input 
                                type="text" 
                                value={t.lapTime2 || ''} 
                                onChange={(e) => updateTeamField(t.id, 'lapTime2', e.target.value)}
                                placeholder="Sek. (z.B. 41.2)" 
                                className="w-28 bg-zinc-950 border border-zinc-800 text-center text-sm py-1 rounded focus:border-amber-500 text-zinc-100"
                              />
                            ) : (
                              <span className="text-sm font-semibold">{t.lapTime2 ? `${t.lapTime2}s` : '--'}</span>
                            )}
                          </div>

                          <div className="text-right min-w-[90px]">
                            <label className="block text-[10px] text-zinc-500 uppercase">Gesamtzeit</label>
                            <span className="text-lg font-bold text-amber-400">
                              {total > 0 ? `${total.toFixed(2)}s` : '--'}
                            </span>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* TAB: CATCH ME IF YOU CAN (K.O.) */}
            {activeTab === 'ko' && (
              <div className="space-y-6">
                <div className="bg-zinc-900 border border-zinc-800 rounded-xl p-4">
                  <h3 className="font-bold text-amber-500 mb-2">🏁 Runde 1 - Jeder muss antreten!</h3>
                  <p className="text-xs text-zinc-400 mb-4">
                    Alle eingetragenen Teams starten direkt in der 1. Runde. Falls ein Duellplatz leer ist ("Kein Gegner"), absolviert das Team sein Rennen alleine auf Bahn 1 und zieht per Klick auf "SIEG" in die nächste Runde ein.
                  </p>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {teams.map((t, idx) => (
                      <div key={t.id} className="bg-zinc-950 border border-zinc-800 p-3 rounded-lg flex items-center justify-between">
                        <div>
                          <span className="text-xs font-bold text-amber-500">Duell {idx + 1}</span>
                          <p className="font-semibold text-sm">#{t.number} {t.name}</p>
                          <p className="text-xs text-zinc-500">vs. Freilos / Einzellauf</p>
                        </div>
                        {role !== 'user' && (
                          <button className="bg-amber-600 hover:bg-amber-500 text-black text-xs font-bold px-3 py-1.5 rounded">
                            SIEG ➡️
                          </button>
                        )}
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* TAB: HAUPTRENNEN */}
            {activeTab === 'main' && (
              <div className="space-y-6">
                {role === 'admin' && (
                  <div className="bg-zinc-900 border border-zinc-800 rounded-xl p-4 flex items-center justify-between">
                    <div>
                      <h4 className="font-bold text-amber-400">Rennleitungs-Sperre Hauptrennen</h4>
                      <p className="text-xs text-zinc-400">Ergebnisse für normale Zuschauer freischalten?</p>
                    </div>
                    <button 
                      onClick={() => setShowMainResult(!showMainResult)}
                      className={`px-4 py-2 rounded-lg text-xs font-bold ${showMainResult ? 'bg-green-600 text-white' : 'bg-red-600 text-white'}`}
                    >
                      {showMainResult ? '🔓 Freigeschaltet' : '🔒 Versteckt'}
                    </button>
                  </div>
                )}

                {role === 'user' && !showMainResult ? (
                  <div className="bg-zinc-900 border border-zinc-800 rounded-xl p-8 text-center space-y-3">
                    <span className="text-4xl">🔒</span>
                    <h3 className="text-lg font-bold text-amber-400">Hauptrennen noch geheim!</h3>
                    <p className="text-sm text-zinc-400">Die Ergebnisse des Hauptrennens werden von der Rennleitung nach der Siegerehrung freigeschaltet.</p>
                  </div>
                ) : (
                  <div className="bg-zinc-900 border border-zinc-800 rounded-xl p-4">
                    <h3 className="font-bold text-amber-400 mb-4">🏆 Punkte im Hauptrennen (3 Läufe)</h3>
                    <div className="space-y-3">
                      {teams.map(t => (
                        <div key={t.id} className="bg-zinc-950 p-3 rounded-lg border border-zinc-800 flex flex-wrap items-center justify-between gap-2">
                          <div>
                            <span className="font-bold text-amber-500">#{t.number} {t.name}</span>
                            <p className="text-xs text-zinc-400">Fahrer: {t.driver}</p>
                          </div>
                          <div className="flex items-center gap-2">
                            <span className="text-xs text-zinc-400">Gesamtpunkte:</span>
                            <span className="text-lg font-bold text-amber-400">{t.score || 0} Pkt</span>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* TAB: TEAMS VERWALTEN */}
            {activeTab === 'teams' && (
              <div className="space-y-6">
                {role === 'admin' && (
                  <form onSubmit={addTeam} className="bg-zinc-900 border border-zinc-800 rounded-xl p-4 space-y-3">
                    <h3 className="font-bold text-amber-400 text-sm">➕ Neues Team hinzufügen</h3>
                    <div className="grid grid-cols-2 md:grid-cols-5 gap-2">
                      <input type="text" placeholder="Start-Nr." value={newNum} onChange={e => setNewNum(e.target.value)} className="bg-zinc-950 border border-zinc-800 rounded p-2 text-xs" />
                      <input type="text" placeholder="Teamname" value={newName} onChange={e => setNewName(e.target.value)} className="bg-zinc-950 border border-zinc-800 rounded p-2 text-xs" required />
                      <input type="text" placeholder="Fahrer" value={newDriver} onChange={e => setNewDriver(e.target.value)} className="bg-zinc-950 border border-zinc-800 rounded p-2 text-xs" />
                      <input type="text" placeholder="Beifahrer" value={newCoDriver} onChange={e => setNewCoDriver(e.target.value)} className="bg-zinc-950 border border-zinc-800 rounded p-2 text-xs" />
                      <input type="text" placeholder="Fahrzeug" value={newCar} onChange={e => setNewCar(e.target.value)} className="bg-zinc-950 border border-zinc-800 rounded p-2 text-xs" />
                    </div>
                    <button type="submit" className="w-full bg-amber-600 hover:bg-amber-500 text-black font-bold py-2 rounded text-xs">Team Anlegen</button>
                  </form>
                )}

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {teams.map(t => (
                    <div key={t.id} className="bg-zinc-900 border border-zinc-800 rounded-xl p-4 space-y-2">
                      <div className="flex items-center justify-between">
                        <span className="text-amber-500 font-bold">#{t.number} {t.name}</span>
                        {role === 'admin' && (
                          <button onClick={() => deleteTeam(t.id)} className="text-xs text-red-400 hover:underline">Löschen</button>
                        )}
                      </div>
                      <div className="text-xs space-y-1 text-zinc-300">
                        <p>🏎️ <strong>Fahrer:</strong> {t.driver}</p>
                        <p>🤝 <strong>Beifahrer:</strong> {t.coDriver}</p>
                        <p>🚘 <strong>Fahrzeug:</strong> {t.car}</p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB: REGELWERK */}
            {activeTab === 'rules' && (
              <div className="bg-zinc-900 border border-zinc-800 rounded-xl p-6 space-y-4 text-sm text-zinc-300 leading-relaxed">
                <h3 className="text-lg font-bold text-amber-400 border-b border-zinc-800 pb-2">📜 Offizielles Regelwerk Kattberger Koppelrennen 2026</h3>
                
                <h4 className="font-bold text-amber-500">1. Allgemeine Grundlagen</h4>
                <p>Das Koppelrennen ist eine Gaudi- & Motorsportveranstaltung auf abgesperrtem Feldterrain. Sicherheit steht an erster Stelle. Helmpflicht gilt für alle Fahrer und Beifahrer während sämtlicher Läufe.</p>

                <h4 className="font-bold text-amber-500">2. Wertungsdisziplinen</h4>
                <ul className="list-disc pl-5 space-y-1">
                  <li><strong>Ringstechen:</strong> Beifahrer sticht während der Fahrt Ringe. Fehlversuche geben keine Punkte.</li>
                  <li><strong>Beste Runde:</strong> Beide Fahrer absolvieren je eine fliegende Runde. Die Summe beider Zeiten ergibt die Gesamtwertung.</li>
                  <li><strong>Catch Me If You Can:</strong> K.O.-Duell. Wer zuerst über die Ziellinie fährt, kommt weiter. Alle Teams starten in Runde 1.</li>
                  <li><strong>Hauptrennen:</strong> 3 Wertungsläufe mit Punktevergabe je Platzierung. Der 2. Lauf startet in umgekehrter Reihenfolge (Reversed Grid).</li>
                </ul>

                <h4 className="font-bold text-amber-500">3. Anweisungen der Rennleitung</h4>
                <p>Den Anweisungen der Rennleitung und Schiedsrichter ist jederzeit Folge zu leisten. Unfaire Fahrweise führt zum sofortigen Disqualifikation für den jeweiligen Lauf.</p>
              </div>
            )}

          </main>

          {/* QR Code Modal */}
          {showQrModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 max-w-sm w-full text-center space-y-4">
                <h3 className="font-bold text-lg text-amber-400">📱 Handys per QR-Code koppeln</h3>
                <p className="text-xs text-zinc-400">Scanne diesen Code mit deiner Handy-Kamera, um live dabei zu sein:</p>
                
                <div className="bg-white p-3 rounded-xl inline-block">
                  <img src={qrUrl} alt="QR Code" className="w-48 h-48 mx-auto" />
                </div>

                <div className="space-y-1 text-left">
                  <label className="text-[10px] text-zinc-500 uppercase">Ziel-URL für QR-Code</label>
                  <input 
                    type="text" 
                    value={manualUrl} 
                    onChange={(e) => setManualUrl(e.target.value)}
                    className="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-xs text-zinc-200"
                  />
                </div>

                <button 
                  onClick={() => setShowQrModal(false)}
                  className="w-full bg-zinc-800 hover:bg-zinc-700 text-white font-bold py-2 rounded-xl text-xs"
                >
                  Schließen
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
