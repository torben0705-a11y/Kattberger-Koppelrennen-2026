<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kattberger Koppelrennen 2026 - Live Board</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    // Firebase an das Window-Objekt anhängen, damit React über Babel darauf zugreifen kann
    window.FirebaseLib = { initializeApp, getFirestore, doc, onSnapshot, setDoc };
  </script>

  <style>
    body { font-family: 'Inter', system-ui, sans-serif; background-color: #09090b; color: #f4f4f5; }
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- ICON HELPER (Inline SVGs für Standalone React) ---
    const Icon = ({ name, className = "w-5 h-5" }) => {
      const icons = {
        Trophy: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 3v4M19 3v4M5 11a7 7 0 0014 0M12 11v8m-4 0h8"></path></svg>,
        Users: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>,
        Clock: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>,
        Play: <svg className={className} fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>,
        Pause: <svg className={className} fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path></svg>,
        RotateCcw: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8m0 0h5M3 8V3"></path></svg>,
        Flag: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 21v-4m0 0V5a2 2 0 012-2h6.5l1 1H21l-3 6 3 6h-8.5l-1-1H5a2 2 0 00-2 2zm9-13.5V9"></path></svg>,
        Shield: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>,
        Lock: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>,
        Unlock: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z"></path></svg>,
        Share2: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg>,
        AlertTriangle: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>,
        Trash2: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>,
        Edit3: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>,
        RefreshCw: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>,
        User: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
      };
      return icons[name] || null;
    };

    // --- STANDARD DATEN ---
    const initialTeams = [
      { id: '1', number: '1', name: 'Team Ackerschreck', p1: 'Hannes', p2: 'Dennis', pin: '1111', ringHits: [false,false,false,false,false], t1: 0, t2: 0, race1Laps: 0, race2Laps: 0, race3Laps: 0, penalties: 0, customPoints: 0, assignedRefId: 'ref1' },
      { id: '2', number: '2', name: 'Rostlaube Racing', p1: 'Max', p2: 'Lukas', pin: '2222', ringHits: [false,false,false,false,false], t1: 0, t2: 0, race1Laps: 0, race2Laps: 0, race3Laps: 0, penalties: 0, customPoints: 0, assignedRefId: 'ref1' },
      { id: '3', number: '3', name: 'Koppel-Heizer', p1: 'Jan', p2: 'Malte', pin: '3333', ringHits: [false,false,false,false,false], t1: 0, t2: 0, race1Laps: 0, race2Laps: 0, race3Laps: 0, penalties: 0, customPoints: 0, assignedRefId: 'ref2' },
      { id: '4', number: '4', name: 'Biernot Motorsport', p1: 'Lisa', p2: 'Svenja', pin: '4444', ringHits: [false,false,false,false,false], t1: 0, t2: 0, race1Laps: 0, race2Laps: 0, race3Laps: 0, penalties: 0, customPoints: 0, assignedRefId: 'ref2' },
      { id: '5', number: '5', name: 'Schrottplatz-Könige', p1: 'Kalle', p2: 'Ralle', pin: '5555', ringHits: [false,false,false,false,false], t1: 0, t2: 0, race1Laps: 0, race2Laps: 0, race3Laps: 0, penalties: 0, customPoints: 0, assignedRefId: '' },
      { id: '6', number: '6', name: 'Kolbenfresser-Crew', p1: 'Steffen', p2: 'Arne', pin: '6666', ringHits: [false,false,false,false,false], t1: 0, t2: 0, race1Laps: 0, race2Laps: 0, race3Laps: 0, penalties: 0, customPoints: 0, assignedRefId: '' }
    ];

    const initialReferees = [
      { id: 'ref1', name: 'Schiri Nord', pin: '1111' },
      { id: 'ref2', name: 'Schiri Süd', pin: '2222' }
    ];

    const generateFixedBracket = (teamList) => {
      const ids = teamList.map(t => t.id).sort(() => Math.random() - 0.5);
      const N = ids.length;

      // Wir bestimmen das Format anhand der nächsten 2er Potenz
      let format = 4;
      if (N > 8) format = 16;
      else if (N > 4) format = 8;

      if (format === 16) {
        return {
          format: 16,
          r1: Array.from({length: 8}, (_, i) => ({ id: `r1_m${i}`, t1: ids[i*2] || '', t2: ids[i*2+1] || '', winner: '' })),
          r2: Array.from({length: 4}, (_, i) => ({ id: `r2_m${i}`, t1: '', t2: '', winner: '' })),
          r3: Array.from({length: 2}, (_, i) => ({ id: `r3_m${i}`, t1: '', t2: '', winner: '' })),
          r4: {
            finale: { id: 'r4_finale', t1: '', t2: '', winner: '' },
            platz3: { id: 'r4_p3', t1: '', t2: '', winner: '' }
          }
        };
      } else if (format === 8) {
        return {
          format: 8,
          r1: Array.from({length: 4}, (_, i) => ({ id: `r1_m${i}`, t1: ids[i*2] || '', t2: ids[i*2+1] || '', winner: '' })),
          r2: Array.from({length: 2}, (_, i) => ({ id: `r2_m${i}`, t1: '', t2: '', winner: '' })),
          r4: {
            finale: { id: 'r4_finale', t1: '', t2: '', winner: '' },
            platz3: { id: 'r4_p3', t1: '', t2: '', winner: '' }
          }
        };
      } else {
        return {
          format: 4,
          r1: Array.from({length: 2}, (_, i) => ({ id: `r1_m${i}`, t1: ids[i*2] || '', t2: ids[i*2+1] || '', winner: '' })),
          r4: {
            finale: { id: 'r4_finale', t1: '', t2: '', winner: '' },
            platz3: { id: 'r4_p3', t1: '', t2: '', winner: '' }
          }
        };
      }
    };

    const computeTournamentTree = (bracketState) => {
      if (!bracketState) return null;
      const b = JSON.parse(JSON.stringify(bracketState));
      
      const getLoser = (match) => {
        if (!match || !match.winner) return '';
        if (match.winner === match.t1) return match.t2;
        if (match.winner === match.t2) return match.t1;
        return '';
      };

      const propagate = (sourceRound, targetRound) => {
        targetRound.forEach((m, i) => {
          m.t1 = sourceRound[i*2]?.winner || '';
          m.t2 = sourceRound[i*2+1]?.winner || '';
          if (m.winner && m.winner !== m.t1 && m.winner !== m.t2) m.winner = '';
        });
      };

      if (b.format === 16) {
        if (b.r2) propagate(b.r1, b.r2);
        if (b.r3) propagate(b.r2, b.r3);
        
        b.r4.finale.t1 = b.r3[0]?.winner || '';
        b.r4.finale.t2 = b.r3[1]?.winner || '';
        if (b.r4.finale.winner && b.r4.finale.winner !== b.r4.finale.t1 && b.r4.finale.winner !== b.r4.finale.t2) b.r4.finale.winner = '';
        
        b.r4.platz3.t1 = getLoser(b.r3[0]);
        b.r4.platz3.t2 = getLoser(b.r3[1]);
        if (b.r4.platz3.winner && b.r4.platz3.winner !== b.r4.platz3.t1 && b.r4.platz3.winner !== b.r4.platz3.t2) b.r4.platz3.winner = '';
      } else if (b.format === 8) {
        if (b.r2) propagate(b.r1, b.r2);
        
        b.r4.finale.t1 = b.r2[0]?.winner || '';
        b.r4.finale.t2 = b.r2[1]?.winner || '';
        if (b.r4.finale.winner && b.r4.finale.winner !== b.r4.finale.t1 && b.r4.finale.winner !== b.r4.finale.t2) b.r4.finale.winner = '';
        
        b.r4.platz3.t1 = getLoser(b.r2[0]);
        b.r4.platz3.t2 = getLoser(b.r2[1]);
        if (b.r4.platz3.winner && b.r4.platz3.winner !== b.r4.platz3.t1 && b.r4.platz3.winner !== b.r4.platz3.t2) b.r4.platz3.winner = '';
      } else if (b.format === 4) {
        b.r4.finale.t1 = b.r1[0]?.winner || '';
        b.r4.finale.t2 = b.r1[1]?.winner || '';
        if (b.r4.finale.winner && b.r4.finale.winner !== b.r4.finale.t1 && b.r4.finale.winner !== b.r4.finale.t2) b.r4.finale.winner = '';
        
        b.r4.platz3.t1 = getLoser(b.r1[0]);
        b.r4.platz3.t2 = getLoser(b.r1[1]);
        if (b.r4.platz3.winner && b.r4.platz3.winner !== b.r4.platz3.t1 && b.r4.platz3.winner !== b.r4.platz3.t2) b.r4.platz3.winner = '';
      }
      
      return b;
    };

    function App() {
      // States mit LocalStorage Synchronisierung
      const [teams, setTeams] = useState(() => {
        try {
          const local = localStorage.getItem('kk2026_teams');
          return local ? JSON.parse(local) : initialTeams;
        } catch (e) { return initialTeams; }
      });

      const [bracket, setBracket] = useState(() => {
        try {
          const local = localStorage.getItem('kk2026_bracket');
          const parsed = local ? JSON.parse(local) : null;
          if (parsed && parsed.format) return parsed;
          return generateFixedBracket(initialTeams);
        } catch (e) { return generateFixedBracket(initialTeams); }
      });

      const [referees, setReferees] = useState(() => {
        try {
          const local = localStorage.getItem('kk2026_referees');
          return local ? JSON.parse(local) : initialReferees;
        } catch (e) { return initialReferees; }
      });

      const [adminPin, setAdminPin] = useState(() => localStorage.getItem('kk2026_adminPin') || '24977');
      const [isRaceReleased, setIsRaceReleased] = useState(() => localStorage.getItem('kk2026_released') === 'true');
      const [dbSynced, setDbSynced] = useState(false);

      // UI States
      const [activeTab, setActiveTab] = useState('leaderboard');
      const [activeCatchMeRound, setActiveCatchMeRound] = useState('r1');
      const [bestLapSortMode, setBestLapSortMode] = useState('number');
      
      // Rollen System
      const [role, setRole] = useState('viewer'); // viewer, admin, referee, team
      const [activeRefId, setActiveRefId] = useState('');
      const [activeTeamId, setActiveTeamId] = useState('');

      // Modals
      const [showPinModal, setShowPinModal] = useState(false);
      const [loginType, setLoginType] = useState('admin');
      const [selectedRefId, setSelectedRefId] = useState('');
      const [selectedTeamId, setSelectedTeamId] = useState('');
      const [pinInput, setPinInput] = useState('');
      const [pinError, setPinError] = useState(false);
      const [showShareModal, setShowShareModal] = useState(false);
      const [shareUrl, setShareUrl] = useState(window.location.href);
      const [confirmModal, setConfirmModal] = useState({ isOpen: false, title: '', message: '', action: null });

      // Stoppuhr
      const [time, setTime] = useState(0);
      const [isRunning, setIsRunning] = useState(false);
      const timerRef = useRef(null);
      const [selectedTimerTeam, setSelectedTimerTeam] = useState('');
      const [selectedTimerDriver, setSelectedTimerDriver] = useState('p1');

      // Lokales Speichern bei Änderungen
      const saveToCloud = (newTeams, newBracket = null, newReferees = null, newAdminPin = null, newReleased = null) => {
        if (newTeams) {
          setTeams(newTeams);
          localStorage.setItem('kk2026_teams', JSON.stringify(newTeams));
        }
        if (newBracket) {
          setBracket(newBracket);
          localStorage.setItem('kk2026_bracket', JSON.stringify(newBracket));
        }
        if (newReferees) {
          setReferees(newReferees);
          localStorage.setItem('kk2026_referees', JSON.stringify(newReferees));
        }
        if (newAdminPin !== null) {
          setAdminPin(newAdminPin);
          localStorage.setItem('kk2026_adminPin', newAdminPin);
        }
        if (newReleased !== null) {
          setIsRaceReleased(newReleased);
          localStorage.setItem('kk2026_released', newReleased.toString());
        }

        // Falls Firebase eingebunden ist, synce dorthin:
        if (window.FirebaseLib && window.db) {
          try {
            const updateData = {};
            if (newTeams) updateData.teams = newTeams;
            if (newBracket) updateData.bracket = newBracket;
            if (newReferees) updateData.referees = newReferees;
            if (newAdminPin) updateData.adminPin = newAdminPin;
            if (newReleased !== null) updateData.isRaceReleased = newReleased;
            window.FirebaseLib.setDoc(window.FirebaseLib.doc(window.db, 'kattberger', 'liveState'), updateData, { merge: true });
          } catch (e) { console.warn("Firebase save error", e); }
        }
      };

      // Timer Effect
      useEffect(() => {
        if (isRunning) {
          const startTime = Date.now() - time;
          timerRef.current = setInterval(() => {
            setTime(Date.now() - startTime);
          }, 10);
        } else {
          clearInterval(timerRef.current);
        }
        return () => clearInterval(timerRef.current);
      }, [isRunning, time]);

      const formatTime = (timeInMs) => {
        const m = Math.floor(timeInMs / 60000);
        const s = Math.floor((timeInMs % 60000) / 1000);
        const cs = Math.floor((timeInMs % 1000) / 10);
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}.${cs.toString().padStart(2, '0')}`;
      };

      const canEditTeam = (team) => {
        if (!team) return false;
        if (role === 'admin') return true;
        if (role === 'referee' && activeRefId) return team.assignedRefId === activeRefId;
        return false;
      };

      const canEditMatch = (match) => {
        if (!match) return false;
        if (role === 'admin') return true;
        if (role === 'referee' && activeRefId) {
          const t1Obj = teams.find(t => t.id === match.t1);
          const t2Obj = teams.find(t => t.id === match.t2);
          return (t1Obj && t1Obj.assignedRefId === activeRefId) || (t2Obj && t2Obj.assignedRefId === activeRefId);
        }
        return false;
      };

      const getLapTimesRankings = () => {
        const teamsWithTimes = teams
          .filter(t => t.t1 > 0 && t.t2 > 0)
          .map(t => ({ id: t.id, totalTime: t.t1 + t.t2 }))
          .sort((a, b) => a.totalTime - b.totalTime);

        const rankings = {};
        teamsWithTimes.forEach((item, index) => {
          if (index === 0) rankings[item.id] = 30;
          else if (index === 1) rankings[item.id] = 20;
          else if (index === 2) rankings[item.id] = 10;
          else rankings[item.id] = 0;
        });
        return rankings;
      };

      const activeBracketState = useMemo(() => computeTournamentTree(bracket), [bracket]);

      const getCatchMePoints = (teamId) => {
        if (!activeBracketState || !activeBracketState.r4) return 0;
        const finalMatch = activeBracketState.r4.finale;
        const p3Match = activeBracketState.r4.platz3;
        if (finalMatch.winner === teamId) return 30;
        const finalLoser = finalMatch.winner ? (finalMatch.winner === finalMatch.t1 ? finalMatch.t2 : finalMatch.t1) : '';
        if (finalLoser === teamId) return 20;
        if (p3Match.winner === teamId) return 10;
        return 0;
      };

      const getLeaderboard = () => {
        const lapRankings = getLapTimesRankings();
        return [...teams].map(t => {
          const ring = (t.ringHits || []).filter(Boolean).length * 5;
          const lap = lapRankings[t.id] || 0;
          const catchMe = getCatchMePoints(t.id);
          const race = (isRaceReleased || role === 'admin') ? ((t.race1Laps||0) + (t.race2Laps||0) + (t.race3Laps||0)) * 5 : 0;
          const total = ring + lap + catchMe + race + (t.customPoints||0) - (t.penalties||0);
          return { ...t, ringPoints: ring, lapPoints: lap, catchMePoints: catchMe, racePoints: race, totalPoints: total };
        }).sort((a, b) => b.totalPoints - a.totalPoints);
      };

      const sortedLeaderboard = getLeaderboard();
      const reverseGrid = [...sortedLeaderboard].reverse();

      const getTeamName = (id) => {
        const t = teams.find(x => x.id === id);
        return t ? `#${t.number} ${t.name}` : 'Noch offen';
      };
      
      const getTeamDrivers = (id) => {
        const t = teams.find(x => x.id === id);
        return t ? `${t.p1} & ${t.p2}` : '';
      };

      const handleSetWinner = (roundKey, matchIndex, winnerId) => {
        let updated = JSON.parse(JSON.stringify(bracket));
        if (roundKey === 'r1') updated.r1[matchIndex].winner = winnerId;
        else if (roundKey === 'r2') updated.r2[matchIndex].winner = winnerId;
        else if (roundKey === 'r3') updated.r3[matchIndex].winner = winnerId;
        else if (roundKey === 'finale') updated.r4.finale.winner = winnerId;
        else if (roundKey === 'platz3') updated.r4.platz3.winner = winnerId;
        saveToCloud(null, computeTournamentTree(updated));
      };

      const saveDriverTime = (teamId, driverKey, seconds) => {
        const newTeams = teams.map(t => {
          if (t.id === teamId) return { ...t, [driverKey]: parseFloat(seconds) || 0 };
          return t;
        });
        saveToCloud(newTeams);
      };

      const toggleRingHit = (teamId, idx) => {
        const newTeams = teams.map(t => {
          if (t.id === teamId) {
            const hits = [...(t.ringHits || [false,false,false,false,false])];
            hits[idx] = !hits[idx];
            return { ...t, ringHits: hits };
          }
          return t;
        });
        saveToCloud(newTeams);
      };

      const updateRaceLaps = (teamId, raceKey, delta) => {
        const newTeams = teams.map(t => {
          if (t.id === teamId) {
            return { ...t, [raceKey]: Math.max(0, (t[raceKey] || 0) + delta) };
          }
          return t;
        });
        saveToCloud(newTeams);
      };

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        if (loginType === 'admin' && pinInput === adminPin) {
          setRole('admin'); setShowPinModal(false); setPinError(false);
        } else if (loginType === 'referee') {
          const r = referees.find(x => x.id === selectedRefId);
          if (r && r.pin === pinInput) {
            setRole('referee'); setActiveRefId(r.id); setShowPinModal(false); setPinError(false);
          } else setPinError(true);
        } else if (loginType === 'team') {
          const t = teams.find(x => x.id === selectedTeamId);
          if (t && (t.pin || '1234') === pinInput) {
            setRole('team'); setActiveTeamId(t.id); setShowPinModal(false); setPinError(false);
          } else setPinError(true);
        } else {
          setPinError(true);
        }
      };

      return (
        <div className="min-h-screen pb-20">
          
          {/* Header Banner */}
          <div className="bg-zinc-900 border-b border-zinc-800 flex justify-between items-center p-2 text-xs font-bold">
            <div className="flex items-center gap-2 text-zinc-400">
              {role === 'viewer' ? <Icon name="Lock" className="w-4 h-4" /> : <Icon name="Unlock" className="w-4 h-4 text-emerald-500" />}
              <span>
                {role === 'admin' ? 'Rennleitung' : role === 'referee' ? 'Schiedsrichter Modus' : role === 'team' ? 'Team Modus' : 'Zuschauer Modus'}
              </span>
            </div>
            {role !== 'viewer' ? (
              <button onClick={() => { setRole('viewer'); setActiveRefId(''); setActiveTeamId(''); }} className="bg-black text-zinc-300 px-3 py-1 rounded-full uppercase">Logout</button>
            ) : (
              <button onClick={() => { setPinInput(''); setPinError(false); setShowPinModal(true); }} className="bg-amber-500 text-black px-3 py-1 rounded-full uppercase">Login</button>
            )}
          </div>

          <header className="text-center py-6 border-b border-zinc-800 relative bg-black overflow-hidden">
            <div className="absolute inset-0 opacity-10 bg-[radial-gradient(#f59e0b_1px,transparent_1px)] [background-size:16px_16px]"></div>
            <div className="relative z-10">
              <h1 className="text-3xl md:text-5xl font-black uppercase text-zinc-100 tracking-tighter">Kattberger Koppelrennen</h1>
              <div className="mt-3 flex justify-center gap-3">
                <button onClick={() => { setShareUrl(window.location.href); setShowShareModal(true); }} className="bg-amber-500 text-black px-4 py-1.5 rounded-full font-bold text-xs uppercase flex items-center gap-2">
                  <Icon name="Share2" className="w-4 h-4" /> Handys koppeln (QR)
                </button>
              </div>
            </div>
          </header>

          {/* Navigation Tabs */}
          <div className="sticky top-0 z-40 bg-zinc-950 border-b border-zinc-800 p-2 shadow-xl overflow-x-auto">
            <div className="flex gap-2 min-w-max px-2">
              {[
                { id: 'leaderboard', icon: 'Trophy', label: 'Gesamtstand' },
                { id: 'teams', icon: 'Users', label: 'Teams' },
                { id: 'ringstechen', icon: 'Trophy', label: '1. Ringe' },
                { id: 'schnellsteRunde', icon: 'Clock', label: '2. Runde' },
                { id: 'catchMe', icon: 'Flag', label: '3. Catch Me' },
                { id: 'hauptrennen', icon: 'Flag', label: '4. Hauptrennen' }
              ].map(t => (
                <button key={t.id} onClick={() => setActiveTab(t.id)} className={`flex items-center gap-1.5 px-4 py-2.5 rounded-lg text-xs font-bold uppercase transition ${activeTab === t.id ? 'bg-amber-500 text-black' : 'text-zinc-400 hover:bg-zinc-900'}`}>
                  <Icon name={t.icon} className="w-4 h-4" /> {t.label}
                </button>
              ))}
            </div>
          </div>

          <main className="max-w-6xl mx-auto px-4 mt-6">
            
            {/* TAB: LEADERBOARD */}
            {activeTab === 'leaderboard' && (
              <div className="space-y-6">
                {role === 'admin' && (
                  <div className="bg-zinc-900 p-4 rounded-xl border border-amber-500/30 flex justify-between items-center">
                    <div>
                      <h3 className="font-bold text-amber-500">Rennleitung: Hauptrennen Freigabe</h3>
                      <p className="text-xs text-zinc-400">Aktuell: {isRaceReleased ? 'Sichtbar für alle' : 'Geheim'}</p>
                    </div>
                    <button onClick={() => saveToCloud(null, null, null, null, !isRaceReleased)} className="bg-amber-500 text-black font-bold px-4 py-2 rounded-lg text-xs uppercase">
                      {isRaceReleased ? 'Verbergen' : 'Jetzt Freigeben'}
                    </button>
                  </div>
                )}

                <div className="bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden">
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-sm">
                      <thead>
                        <tr className="bg-zinc-950 text-zinc-500 text-xs uppercase border-b border-zinc-800">
                          <th className="p-3 text-center">Pos</th>
                          <th className="p-3">Team</th>
                          <th className="p-3 text-center">Ringe</th>
                          <th className="p-3 text-center">Runde</th>
                          <th className="p-3 text-center">Catch</th>
                          <th className="p-3 text-center">Haupt</th>
                          <th className="p-3 text-center text-amber-400 font-bold">Punkte</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-zinc-800/50">
                        {sortedLeaderboard.map((t, i) => (
                          <tr key={t.id} className="hover:bg-zinc-900/50">
                            <td className="p-3 text-center font-bold">{i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `#${i+1}`}</td>
                            <td className="p-3 font-bold text-zinc-200">#{t.number} {t.name} <br/><span className="text-[10px] text-zinc-500 font-normal">{t.p1} & {t.p2}</span></td>
                            <td className="p-3 text-center font-mono text-zinc-400">{t.ringPoints}</td>
                            <td className="p-3 text-center font-mono text-zinc-400">{t.lapPoints}</td>
                            <td className="p-3 text-center font-mono text-zinc-400">{t.catchMePoints}</td>
                            <td className="p-3 text-center font-mono text-zinc-400">{isRaceReleased || role === 'admin' ? t.racePoints : '🔒'}</td>
                            <td className="p-3 text-center font-black text-amber-400 text-lg bg-amber-500/5">{t.totalPoints}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* TAB: TEAMS (Simplified View) */}
            {activeTab === 'teams' && (
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                {teams.map(team => (
                  <div key={team.id} className="bg-zinc-900 border border-zinc-800 p-4 rounded-xl">
                    <h3 className="font-bold text-lg text-amber-400">#{team.number} {team.name}</h3>
                    <p className="text-zinc-400 text-sm mt-2">Fahrer 1: <span className="text-zinc-200">{team.p1}</span></p>
                    <p className="text-zinc-400 text-sm">Fahrer 2: <span className="text-zinc-200">{team.p2}</span></p>
                    {role === 'admin' && (
                      <p className="text-red-400 text-xs mt-2 font-mono">PIN: {team.pin}</p>
                    )}
                  </div>
                ))}
              </div>
            )}

            {/* TAB: RINGSTECHEN */}
            {activeTab === 'ringstechen' && (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {teams.filter(t => role !== 'team' || t.id === activeTeamId).map(team => (
                  <div key={team.id} className="bg-zinc-900 border border-zinc-800 p-4 rounded-xl flex justify-between items-center">
                    <div>
                      <h3 className="font-bold text-zinc-200">#{team.number} {team.name}</h3>
                      <p className="text-xs text-amber-500 font-bold mt-1">{(team.ringHits||[]).filter(Boolean).length * 5} Punkte</p>
                    </div>
                    <div className="flex gap-1.5">
                      {(team.ringHits || [false,false,false,false,false]).map((hit, i) => (
                        <button key={i} disabled={!canEditTeam(team)} onClick={() => toggleRingHit(team.id, i)} 
                          className={`w-10 h-10 rounded font-bold transition ${hit ? 'bg-amber-500 text-black' : 'bg-zinc-950 border border-zinc-800 text-zinc-600'} ${!canEditTeam(team) ? 'opacity-50' : ''}`}>
                          {hit ? '✔' : i+1}
                        </button>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            )}

            {/* TAB: BESTE RUNDE */}
            {activeTab === 'schnellsteRunde' && (
              <div className="space-y-6">
                <div className="bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden">
                  <div className="p-3 bg-zinc-950 flex justify-end gap-2">
                    <button onClick={() => setBestLapSortMode('number')} className={`text-xs px-3 py-1 rounded ${bestLapSortMode==='number' ? 'bg-amber-500 text-black' : 'text-zinc-400'}`}>Nach Nr.</button>
                    <button onClick={() => setBestLapSortMode('time')} className={`text-xs px-3 py-1 rounded ${bestLapSortMode==='time' ? 'bg-amber-500 text-black' : 'text-zinc-400'}`}>Nach Zeit</button>
                  </div>
                  <table className="w-full text-left text-sm">
                    <thead>
                      <tr className="bg-zinc-950 text-zinc-500 text-xs border-b border-zinc-800">
                        <th className="p-3">Team</th>
                        <th className="p-3">Fahrer 1</th>
                        <th className="p-3">Fahrer 2</th>
                        <th className="p-3 text-center">Gesamt</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-zinc-800">
                      {[...teams].sort((a,b) => bestLapSortMode === 'number' ? parseInt(a.number)-parseInt(b.number) : ((a.t1+a.t2) || 999) - ((b.t1+b.t2) || 999)).filter(t => role !== 'team' || t.id === activeTeamId).map(t => (
                        <tr key={t.id}>
                          <td className="p-3 font-bold text-zinc-200">#{t.number} {t.name}</td>
                          <td className="p-3">
                            {canEditTeam(t) ? <input type="number" step="0.01" value={t.t1||''} onChange={e=>saveDriverTime(t.id, 't1', e.target.value)} className="w-20 bg-zinc-950 border border-zinc-800 rounded p-1 text-center" /> : <span className="text-zinc-400">{t.t1>0?`${t.t1}s`:''}</span>}
                          </td>
                          <td className="p-3">
                            {canEditTeam(t) ? <input type="number" step="0.01" value={t.t2||''} onChange={e=>saveDriverTime(t.id, 't2', e.target.value)} className="w-20 bg-zinc-950 border border-zinc-800 rounded p-1 text-center" /> : <span className="text-zinc-400">{t.t2>0?`${t.t2}s`:''}</span>}
                          </td>
                          <td className="p-3 text-center font-bold text-amber-500">{t.t1>0&&t.t2>0 ? (t.t1+t.t2).toFixed(2)+'s' : '-'}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* TAB: CATCH ME IF YOU CAN (Mit neuer Alle-Teams-Logik) */}
            {activeTab === 'catchMe' && (
              <div className="space-y-4">
                {role === 'admin' && (
                  <button onClick={() => {
                    const newBracket = generateFixedBracket(teams);
                    saveToCloud(null, newBracket);
                    setActiveCatchMeRound('r1');
                  }} className="bg-zinc-800 text-zinc-200 px-4 py-2 rounded text-xs font-bold w-full mb-4">
                    K.O.-Baum komplett neu auslosen (Alle {teams.length} Teams starten in R1)
                  </button>
                )}

                <div className="flex gap-2 overflow-x-auto bg-zinc-950 p-1 rounded-lg">
                  {['r1', 'r2', 'r3', 'r4'].map(r => activeBracketState?.[r] && (
                    <button key={r} onClick={() => setActiveCatchMeRound(r)} className={`px-4 py-2 text-xs font-bold rounded uppercase ${activeCatchMeRound === r ? 'bg-amber-500 text-black' : 'text-zinc-500'}`}>
                      {r === 'r4' ? 'Finals' : `Runde ${r.replace('r','')}`}
                    </button>
                  ))}
                </div>

                {activeBracketState && activeCatchMeRound !== 'r4' && (
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {activeBracketState[activeCatchMeRound]?.map((match, i) => {
                      const canEdit = canEditMatch(match);
                      const isBye = activeCatchMeRound === 'r1' && (!match.t1 || !match.t2) && (match.t1 || match.t2); // Ein Team fehlt
                      
                      return (
                        <div key={match.id} className={`border ${canEdit?'border-amber-500/50 bg-zinc-900':'border-zinc-800 bg-zinc-900/40'} p-4 rounded-xl space-y-2`}>
                          <span className="text-[10px] text-zinc-500 font-bold uppercase">Duell #{i+1} {isBye ? '(Alleinige Fahrt)' : ''}</span>
                          
                          <button disabled={!canEdit || !match.t1} onClick={() => handleSetWinner(activeCatchMeRound, i, match.t1)}
                            className={`w-full p-3 rounded-lg text-left flex justify-between items-center transition ${!match.t1?'border border-dashed border-zinc-800 opacity-50':match.winner===match.t1?'bg-amber-500 text-black font-bold':'bg-zinc-950 border border-zinc-800 text-zinc-300'}`}>
                            <span>{match.t1 ? getTeamName(match.t1) : 'Leer / Kein Gegner'}</span>
                            {match.winner===match.t1 && <span className="text-[10px] bg-black text-amber-400 px-2 py-1 rounded">SIEG</span>}
                          </button>
                          
                          <div className="text-center text-[10px] text-zinc-600 font-bold">VS</div>
                          
                          <button disabled={!canEdit || !match.t2} onClick={() => handleSetWinner(activeCatchMeRound, i, match.t2)}
                            className={`w-full p-3 rounded-lg text-left flex justify-between items-center transition ${!match.t2?'border border-dashed border-zinc-800 opacity-50':match.winner===match.t2?'bg-amber-500 text-black font-bold':'bg-zinc-950 border border-zinc-800 text-zinc-300'}`}>
                            <span>{match.t2 ? getTeamName(match.t2) : 'Leer / Kein Gegner'}</span>
                            {match.winner===match.t2 && <span className="text-[10px] bg-black text-amber-400 px-2 py-1 rounded">SIEG</span>}
                          </button>
                        </div>
                      )
                    })}
                  </div>
                )}

                {activeBracketState && activeCatchMeRound === 'r4' && (
                  <div className="space-y-6">
                    {/* Finale */}
                    <div className="border border-amber-500 p-4 rounded-xl space-y-2 bg-amber-950/20">
                      <h4 className="text-xs font-black text-amber-400 uppercase">🥇 Das große Finale</h4>
                      <button disabled={!canEditMatch(activeBracketState.r4.finale) || !activeBracketState.r4.finale.t1} onClick={() => handleSetWinner('finale', 0, activeBracketState.r4.finale.t1)} className={`w-full p-3 rounded-lg text-left flex justify-between transition ${activeBracketState.r4.finale.winner===activeBracketState.r4.finale.t1?'bg-amber-500 text-black font-bold':'bg-zinc-950 border border-zinc-800 text-zinc-300'}`}>
                        {getTeamName(activeBracketState.r4.finale.t1)}
                      </button>
                      <button disabled={!canEditMatch(activeBracketState.r4.finale) || !activeBracketState.r4.finale.t2} onClick={() => handleSetWinner('finale', 0, activeBracketState.r4.finale.t2)} className={`w-full p-3 rounded-lg text-left flex justify-between transition ${activeBracketState.r4.finale.winner===activeBracketState.r4.finale.t2?'bg-amber-500 text-black font-bold':'bg-zinc-950 border border-zinc-800 text-zinc-300'}`}>
                        {getTeamName(activeBracketState.r4.finale.t2)}
                      </button>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* TAB: HAUPTRENNEN */}
            {activeTab === 'hauptrennen' && (
              <div className="space-y-4">
                <div className="bg-zinc-950 p-4 rounded-xl border border-zinc-800 mb-6">
                  <h3 className="text-xs font-bold text-amber-400 uppercase mb-2">🚥 Startaufstellung (Reversed Grid)</h3>
                  <div className="flex flex-wrap gap-2">
                    {reverseGrid.map((t, i) => (
                      <span key={t.id} className="bg-zinc-900 border border-zinc-800 px-3 py-1.5 rounded text-xs font-bold text-zinc-300">
                        P{i+1}: #{t.number}
                      </span>
                    ))}
                  </div>
                </div>

                <div className="space-y-3">
                  {teams.map(t => (
                    <div key={t.id} className="bg-zinc-900 border border-zinc-800 p-4 rounded-xl flex flex-col sm:flex-row justify-between items-center gap-4">
                      <div className="text-center sm:text-left">
                        <span className="font-bold text-zinc-100">#{t.number} {t.name}</span>
                        <p className="text-xs text-amber-500 mt-1">Total: {((t.race1Laps||0)+(t.race2Laps||0)+(t.race3Laps||0))*5} Pkt</p>
                      </div>
                      <div className="flex gap-2">
                        {['race1Laps', 'race2Laps', 'race3Laps'].map((r, i) => (
                          <div key={r} className="bg-zinc-950 border border-zinc-800 p-2 rounded text-center min-w-[70px]">
                            <span className="text-[10px] text-zinc-500 block mb-1">Lauf {i+1}</span>
                            <div className="flex items-center justify-center gap-2">
                              {canEditTeam(t) && <button onClick={()=>updateRaceLaps(t.id, r, -1)} className="text-zinc-400 hover:text-white">-</button>}
                              <span className="font-bold font-mono text-zinc-200">{t[r]||0}</span>
                              {canEditTeam(t) && <button onClick={()=>updateRaceLaps(t.id, r, 1)} className="text-zinc-400 hover:text-white">+</button>}
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

          </main>

          {/* SHARE MODAL */}
          {showShareModal && (
            <div className="fixed inset-0 bg-black/90 flex items-center justify-center z-50 p-4">
              <div className="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl w-full max-w-sm text-center">
                <h3 className="font-bold text-amber-400 uppercase text-lg mb-4">Handys Koppeln</h3>
                <img src={`https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(shareUrl)}`} alt="QR" className="w-48 h-48 mx-auto bg-white p-2 rounded-xl mb-4" />
                <input type="text" value={shareUrl} onChange={e=>setShareUrl(e.target.value)} className="w-full bg-zinc-950 border border-zinc-800 text-xs p-2 rounded text-zinc-400 text-center mb-4" />
                <button onClick={() => setShowShareModal(false)} className="w-full bg-amber-500 text-black font-bold py-2 rounded">Schließen</button>
              </div>
            </div>
          )}

          {/* LOGIN MODAL */}
          {showPinModal && (
            <div className="fixed inset-0 bg-black/90 flex items-center justify-center z-50 p-4">
              <form onSubmit={handleLoginSubmit} className="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl w-full max-w-sm">
                <h3 className="font-bold text-amber-400 uppercase text-center mb-4">Login / Freischalten</h3>
                <div className="flex gap-1 mb-4 bg-zinc-950 p-1 rounded text-xs font-bold">
                  <button type="button" onClick={()=>setLoginType('admin')} className={`flex-1 py-1.5 rounded ${loginType==='admin'?'bg-amber-500 text-black':'text-zinc-500'}`}>Admin</button>
                  <button type="button" onClick={()=>{setLoginType('referee'); if(referees.length>0) setSelectedRefId(referees[0].id);}} className={`flex-1 py-1.5 rounded ${loginType==='referee'?'bg-emerald-500 text-black':'text-zinc-500'}`}>Schiri</button>
                  <button type="button" onClick={()=>{setLoginType('team'); if(teams.length>0) setSelectedTeamId(teams[0].id);}} className={`flex-1 py-1.5 rounded ${loginType==='team'?'bg-blue-500 text-white':'text-zinc-500'}`}>Team</button>
                </div>
                
                {loginType === 'referee' && (
                  <select value={selectedRefId} onChange={e=>setSelectedRefId(e.target.value)} className="w-full bg-zinc-950 border border-zinc-800 p-2 rounded text-sm text-zinc-200 mb-3">
                    {referees.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
                  </select>
                )}
                {loginType === 'team' && (
                  <select value={selectedTeamId} onChange={e=>setSelectedTeamId(e.target.value)} className="w-full bg-zinc-950 border border-zinc-800 p-2 rounded text-sm text-zinc-200 mb-3">
                    {teams.map(t => <option key={t.id} value={t.id}>#{t.number} {t.name}</option>)}
                  </select>
                )}

                <input type="password" placeholder="PIN eingeben" value={pinInput} onChange={e=>setPinInput(e.target.value)} className="w-full bg-zinc-950 border border-zinc-800 p-2 rounded text-center text-lg font-mono text-zinc-200 mb-4" required />
                {pinError && <p className="text-red-500 text-xs text-center mb-2">Falsche PIN!</p>}
                
                <div className="flex gap-2">
                  <button type="button" onClick={() => setShowPinModal(false)} className="flex-1 bg-zinc-800 text-zinc-300 py-2 rounded font-bold text-xs">Abbrechen</button>
                  <button type="submit" className="flex-1 bg-amber-500 text-black py-2 rounded font-bold text-xs">Einloggen</button>
                </div>
              </form>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
